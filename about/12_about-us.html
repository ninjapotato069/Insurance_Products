n":{"id":46458,"TitleTag":"About Generali Central Life Insura Generali Central Life Insurance | About Usnce | Our Mission","CanonicalTag":"https://www.generalicentrallife.com/about-us","MetaKeyword":"about generali central life insurance\nabout generali central life","MetaDescription":"Learn about Generali Central Life Insurance. Discover our history, values \u0026 commitment to providing trusted, comprehensive life insurance protection.\n","SchemaTag":[{"id":1167,"Text":"{\n  \"@context\": \"https://schema.org\",\n  \"@graph\": [\n    {\n      \"@type\": \"AboutPage\",\n      \"@id\": \"https://www.generalicentrallife.com/about-us#webpage\",\n      \"url\": \"https://www.generalicentrallife.com/about-us\",\n      \"name\": \"Generali Central Life Insurance\",\n      \"description\": \"Trust Innovations with Generali Central\",\n      \"abstract\": \"Generali Central Life Insurance Company Limited (formerly Future Generali India Life Insurance Co. Ltd.), headquartered in Mumbai, is one of India’s leading life insurance companies. The company brings together the global expertise and legacy of Generali Group and the established domestic presence of Central Bank of India.\",\n      \"mainEntity\": {\n        \"@id\": \"https://www.generalicentrallife.com/#organization\"\n      },\n      \"breadcrumb\": {\n        \"@id\": \"https://www.generalicentrallife.com/about-us#breadcrumb\"\n      }\n    },\n    {\n      \"@type\": \"Organization\",\n      \"@id\": \"https://www.generalicentrallife.com/#organization\",\n      \"name\": \"Generali Central Life Insurance\",\n      \"legalName\": \"Generali Central Life Insurance Company Limited\",\n      \"url\": \"https://www.generalicentrallife.com/\",\n      \"description\": \"Generali Central Life Insurance Company Limited is a life insurance company headquartered in Mumbai, India, bringing together the global expertise of Generali Group and the domestic presence of Central Bank of India.\",\n      \"address\": {\n        \"@type\": \"PostalAddress\",\n        \"addressLocality\": \"Mumbai\",\n        \"addressCountry\": \"IN\"\n      }\n    },\n    {\n      \"@type\": \"BreadcrumbList\",\n      \"@id\": \"https://www.generalicentrallife.com/about-us#breadcrumb\",\n      \"itemListElement\": [\n        {\n          \"@type\": \"ListItem\",\n          \"position\": 1,\n          \"name\": \"Home\",\n          \"item\": \"https://www.generalicentrallife.com/\"\n        },\n        {\n          \"@type\": \"ListItem\",\n          \"position\": 2,\n          \"name\": \"About Us\",\n          \"item\": \"https://www.generalicentrallife.com/about-us\"\n        }\n      ]\n    }\n  ]\n}\n"}]}},"totalInsuredData":{"id":33,"documentId":"m5cqmyip8778nh9iqg8moygp","Title":"Our Promise is Reflected in the Lives We've Touched","Description":"We bring experience, stability, and a proven approach to supporting your family and financial goals.","Note":"Data as on 31st March, 2026","createdAt":"2025-05-20T03:48:51.281Z","CardList":[{"id":694,"Description":"Our and Partners Branches","Image":{"id":263,"documentId":"yvikqshj63x2k52qac1s9133","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/Branches_05325bf98a.svg","alternativeText":null,"caption":null,"name":"Branches.svg"},"YearList":[{"id":243,"Year":null,"Title":"6019+"}]},{"id":695,"Description":"Lives Protected","Image":{"id":264,"documentId":"ysimdmgpiisdvk74gr4ugcwz","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/Lives_Protected_baf41e88d2.svg","alternativeText":null,"caption":null,"name":"Lives Protected.svg"},"YearList":[{"id":244,"Year":"Since Inception","Title":"946,111"}]},{"id":696,"Description":"of Assets Under Management","Image":{"id":265,"documentId":"wt5d2ybx9lp8b0xkxnamy7hp","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/Assest_Management_9dfa4eaa70.svg","alternativeText":null,"caption":null,"name":"Assest Management.svg"},"YearList":[{"id":245,"Year":null,"Title":"₹104.7 Bn"}]},{"id":697,"Description":"Individual Claim Settlement Ratio","Image":{"id":262,"documentId":"zvo1tmukqeew2g3d090od7bu","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/Individual_Claim_Ratio_84cae7bffd.svg","alternativeText":null,"caption":null,"name":"Individual Claim Ratio.svg"},"YearList":[{"id":246,"Year":" FY 25-26","Title":"99.57%"}]},{"id":698,"Description":"Group Claim Settlement Ratio","Image":{"id":366,"documentId":"z8lq4fhtebpwforqkmae8o00","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/stats_5_1x_6796af483e.webp","alternativeText":null,"caption":null,"name":"stats_5_1x.webp"},"YearList":[{"id":247,"Year":" FY 25-26","Title":"100%"}]}]},"bodList":[{"id":2758,"Description":"Jayakumar (‘Jaya’) is a senior financial services leader with over 30 years of experience in building financial services businesses from scratch and strategically driving growth of existing businesses. During his banking career, he has contributed significantly to the development of the retail banking industry in India. While Jaya has been a consumer banker, he has a good understanding of the Insurance business as well as strong regulatory connects in that space.In his last executive role, he served as the Managing Director \u0026 CEO of Bank of Baroda till late 2019. He joined the bank in 2015 as part of the initiative of the Government of India to get private expertise and worked in transformation of the bank and its subsidiaries. He also managed the first three-way merger of banks (Bank of Baroda, Dena Bank \u0026 Vijaya Bank) in India. He set up the centres of excellence through their subsidiary for processing, IT and analytics.Prior to that, he worked as an entrepreneur and was a cofounder of Value Budget Housing Company, a leader in housing for low to moderate income household. Value Budget Housing pioneered the use of manufacturing approach to construction and application of form and IT technology to low cost and affordable housing. He also co-founded Home First Finance Ltd, a housing finance company licensed by NHB and provides long term purchase money mortgage loans for customers from low to moderate income household. Both these companies have contributed to pioneering effort in building demand and supply for low cost and affordable housing and are focused on serving customers at base of the pyramid and have speared-headed innovation in their respective domain.Jaya started his career with Citibank in 1986, and during his 23 years at Citibank, he worked across consumer and commercial bank, predominantly in India (20 years) and Singapore (3 years). His last held position was CEO of Consumer Bank and Co-Head of Citibank, India but he had been part of Senior Management for Citigroup in India and Asia for over 15 years and closely involved in the development of strategy and execution across the region.While at Citibank, he contributed to several innovations in retail banking. In addition, he was associated with the first asset securitisation in India in 1991 and the first multi-lingual biometric ATM for the financially excluded in 2006. He left Citibank in April 2008.Jayakumar has been a changemaker all his life and continues to be involved in entrepreneurial activities in the financial services space and is currently working on his third startup. He sits on boards of several listed and non-listed companies and advises and mentors many others.In 2018, he was awarded the ‘Banker of the Year’ by Financial Express.","Name":"Palamadai Sundararajan Jayakumar","Designation":"Independent Director \u0026 Chairman","Image":{"id":5481,"documentId":"yp4armgzx0rf08yckgq1zx1v","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/image_0d71462937.webp","alternativeText":null,"caption":null,"name":"image.webp"}},{"id":2759,"Description":"As Regional Officer, Roberto Leonardi oversees Generali Asia’s insurance operations in both Life and Property \u0026 Casualty businesses. Rob has 25 years of experience in Life and Health businesses across Asia, Europe and South Africa.Prior to joining Generali, he was with AXA Asia where he was responsible for Health \u0026 Employment Benefits, Protection, Marketing, Digital and Big Data. Before AXA Asia, Rob worked at Munich Reinsurance where he was Regional Head of the Munich Health overseeing the health reinsurance and insurance businesses with specific focus on Greater China, India, Indonesia and Japan.He also spent 13 years with UnitedHealth International (a listed Fortune 25 company) where he held several executive positions including Executive Vice President \u0026 CEO of UnitedHealth Asia, CEO of Portugal and Chief Operating Officer and Chief Financial Officer in its joint ventures. During his tenure, he turned around the Asia business and was actively involved in M\u0026A activities in various markets across Asia.Rob started his career as a chartered accountant with Coopers \u0026 Lybrand in South Africa. Born in Italy, Rob grew up in Denmark and South Africa and currently lives in Hong Kong.","Name":"Roberto Leonardi","Designation":"Non-Executive Director","Image":{"id":5482,"documentId":"nmq2y801mnaide3qz5lpdep9","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/image_3_cc7f82eb46.webp","alternativeText":null,"caption":null,"name":"image (3).webp"}},{"id":2760,"Description":"Lima Alexandrova is a finance professional with over 15 years of experience in the advisory, banking, and insurance industries with significant international exposure.Lima joined Assicurazioni Generali S.p.A. (“Generali”) in 2020 as part of the Group Chief Investment function, serving as Head of Portfolio Implementation and Investment Mandates. In this capacity, she was responsible for more than EUR 400 billion of Assets under Management of the insurance portfolio. She ensured the effective deployment and implementation of the annual strategic allocation of Generali Group through internal and external Asset Managers and monitored their subsequent performance.In September 2024, Lima was promoted to Head of Insurance Business Performance Asia in the newly created Insurance Division. In this role, she is responsible for monitoring the business performance and initiatives within the Asia Region, working closely with country CEOs as well as the Asia Regional Office.Prior to joining Generali, Lima worked for BlackRock Financial Markets Advisory, focusing on advisory support and portfolio optimization, which enabled her to gain significant experience in Model Risk Management framework (for both set up and implementation) as well as in regulatory strategy and stress-testing.From 2011 to 2017, Lima covered different roles with growing responsibilities within the Risk and Finance functions of UniCredit S.p.A., the largest Italian bank and one of the largest banks within the European Union.Lima’s career started in 2007 at the Beijing Branch of OJSC Promsvyazbank (PSB), where she supported the trade financing operations and provided risk assessment and advisory on Chinese counterparties to the Head Office.Lima holds a Degree in Finance and Economics from St. Petersburg State University (Russia, 2007) and a Master’s in Business Administration from the Altis Business School of Catholic University in Milan (Italy, 2010). She is fully proficient in Russian, Italian, and English, and she can speak German and Mandarin at professional level.","Name":"Lima Alexandrova","Designation":"Non-Executive Director","Image":{"id":5483,"documentId":"zy0ohn3dpe22pq84tfihx135","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/lima_alexandrova_35d2906300.webp","alternativeText":null,"caption":null,"name":"lima_alexandrova.webp"}},{"id":2761,"Description":"Ms. Valentina Sarrocco was appointed as the Non-Executive Director of the Company w.e.f February 17, 2023. Ms. Valentina has almost 20 years’ of corporate and transactional lawyer experience in corporate governance matters, M\u0026A/divestitures, general commercial, cross border transactions, insurance and project financing. Ms. Valentina has also provided pro-bono legal advice to several UN Committees and Agencies.Ms. Valentina was a part of the International General Counsel and Head of Group Entities Corporate Matters of Assicurazioni Generali S.p.A. Prior to joining Generali Group, she worked as a Senior Associate at McDermott Will \u0026 Emery and Chiomenti respectively. Ms. Valentina is also on various Corporate Boards.Ms. Valentina holds a Bachelor’s degree in Law and is a member of the Italian Bar. She has also done Senior Manager Program and Executive Program on M\u0026A transactions from Italy. Ms. Valentina has also attended the Global Leadership Program STEP UP - Lifetime Partner Edition organised by IMD Business School, Zurich and has been to the Wharton School of Business, USA.","Name":"Valentina Sarrocco","Designation":"Non-Executive Director","Image":{"id":5484,"documentId":"nui7ly2fmwniu0i62cmwqw66","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/image_5_b0931e983c.webp","alternativeText":null,"caption":null,"name":"image (5).webp"}},{"id":2762,"Description":"Mr. Mahendra Dohare has been serving as the Executive Director of the Central Bank of India since 09.10.2023. In this role, he oversees several key verticals, including Resources \u0026 Marketing (covering distribution of third-party products, life and general insurance), Customer Care, Stressed Assets Management \u0026 Recovery, Information Technology, Digital Transformation, Digital Payment \u0026 Transaction Banking, MIS \u0026 Data Analytics, Credit Monitoring, and MSME Finance.\nHe is a seasoned banker with over 25 years of experience. Prior to his appointment as Executive Director at the Central Bank of India, he held senior leadership roles at Punjab National Bank and e-UNI, serving as Chief General Manager and General Manager across diverse segments of banking such as Business Acquisition \u0026 Relationship Management, Digital Banking Transformation, Fintech, Credit Cards, Merchant Acquiring Business, and Information Technology.\nMr. Dohare has extensive experience across geographies, having worked in metro, urban, semi-urban, and rural locations, including serving as Regional Head. He has also been a Nominee Director on the Boards of PNB Cards \u0026 Services Ltd. and Tripura Grameen Bank (TGB).\nHe holds an MBA in Marketing \u0026 Finance and is a Certified Associate of the Indian Institute of Bankers (CAIIB). He has also obtained multiple IIBF certifications in Digital Banking, IT Security, Prevention of Cyber Crime \u0026 Fraud Management, Certified Information System Banker, Customer Service, MSME Finance, and Audit \u0026 Accounting.","Name":"Mahendra Dohare","Designation":"Non-Executive Director","Image":{"id":5485,"documentId":"hx8m7qxdu6mngpunkgvvfciu","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/mahendra_3bf443d7cd.webp","alternativeText":null,"caption":null,"name":"mahendra.webp"}},{"id":2763,"Description":"Mr. Vasti Venkatesh is a seasoned banking professional with over 36 years of rich and extensive experience across core banking domains. Throughout his distinguished career at the Central Bank of India, he has held key leadership positions in verticals such as Treasury, Resource Mobilization, Operations, and Marketing. He has effectively served in various roles including Branch Head and Regional Head, with a wide geographic exposure spanning Karnataka, Andhra Pradesh, Madhya Pradesh, Maharashtra, Gujarat, and Delhi. His vast expertise and leadership have significantly contributed to the strategic growth and operational excellence of the institutions he has been associated with. He brings with him a wealth of experience and insights from banking and financial services sector. ","Name":"Vasti Venkatesh","Designation":"Non-Executive Director ","Image":{"id":5486,"documentId":"fdi6i67hqcojv8bwztoiu0o3","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/Vasti_Venkatesh_9d228c206d.webp","alternativeText":null,"caption":null,"name":"Vasti Venkatesh.webp"}},{"id":2764,"Description":"A man who has worn many hats in the corporate world \u0026 raised standards of various organizations so high, that people consider him as a serial Innovator, Pioneer, Teacher, Speaker, Author, Analyst, Entrepreneur \u0026 Citizen of the World (Vasudhaiva Kutumbakam). He is not only a Chartered \u0026 Cost Accountant, Certified Internal Auditor, a Certified Financial Planner, Fraud Examiner, but also a Board Chairman, Audit Committee Chairperson, and an Independent Director at some of the country's most pre-eminent organizations. He is a global thought leader in the area of Environment, Social \u0026 Governance, and has helped pioneer Impactful concepts like IR \u0026 Innovating path to Net Zero. He has been conferred with the Global Competent Boards Designation (GCB.D) by Competent Boards Inc.. He has been awarded “Vivekananda Sustainability Award – 2022” by Vivekananda Youth Connect FoundationMr. Haribhakti actively promotes shared value creation and a green environment through his own enterprise, and his leadership roles as Chairman of the CSR / ESG / Sustainability committees of some of the Boards that he serves on. He has successfully established the concept of “Innovate to Zero” and technology enabling CSR / ESG / SUSTIANABILTIY which is in alignment with the idea of making the impact of every intervention focused, widespread, co-operative and far-reaching","Name":"Shailesh Haribhakti","Designation":"Independent Director","Image":{"id":5487,"documentId":"j0vkbk6aulo2sbhkjkutbupy","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/image_1_caade06cae.webp","alternativeText":null,"caption":null,"name":"image (1).webp"}},{"id":2765,"Description":"Mr. Sharad Kumar Saxena is a distinguished technology leader with over three decades of experience in the banking and financial services industry.\nHe is a gold medallist in Electronics \u0026 Telecommunication Engineering from Government Engineering College, Jabalpur. He brings a rare blend of academic excellence and hands-on leadership in IT strategy, systems implementation, and technology governance. Mr. Saxena is a Certified Information System Auditor (CISA) from ISACA, USA. He is also a Certified ISO 27001 Implementer and a Certified Senior Examiner for Quality Management with the Indian Merchant's Chamber.\nHis career includes pivotal technology leadership roles at ICICI Bank, where he led critical functions across Corporate and Commercial Banking, Asset Products, International Banking, Credit Cards, Cash Management, Core Banking, HR Systems, CRM, and Compliance \u0026 Fraud Management. He also headed the IT Infrastructure group, overseeing networks, and led Technology Compliance, interfacing with all audits and inspections.\nMr. Saxena retired as Chief Technology Officer at Bank of Baroda in 2021. At Bank of Baroda, he played a transformative role in leading the technology integration during the historic merger of Vijaya Bank and Dena Bank with Bank of Baroda.Currently, he continues to contribute to the banking ecosystem as a Technology Advisor to UCO Bank and as an Information Technology Consultant to Indian Bank.","Name":"Sharad Saxena","Designation":"Independent Director ","Image":{"id":5488,"documentId":"jgnwr91ttx1y92hfdt68g4di","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/mr_sharad_saxena_photograph_1_c815dd08bf.webp","alternativeText":null,"caption":null,"name":"mr-sharad-saxena-photograph (1).webp"}},{"id":2766,"Description":"Alok Rungta is the Managing Director \u0026 CEO of Generali Central Life Insurance Company Limited (GCLIC) and is instrumental in transforming the Generali Central India Life’s vision of being a Lifetime Partner amongst all the internal and external stakeholders. Mr. Rungta is a veteran in the Insurance and Financial Services industry with over 25 years of experience, having held leadership roles across India and Southeast Asia, including the Philippines and Hong Kong. He has led initiatives across both Life and General Insurance businesses, notably at AXA, where he served as Asia Regional Financial Controller in Hong Kong and as Chief of Retail Propositions and Head of Health and Protection in the Philippines. His deep industry knowledge of the Indian insurance market makes him a proven leader. He has spearheaded numerous strategic initiatives in the following areas: - Leading transformational digitization initiatives within the organization - Growing a profitable distribution operation - Sales innovation for acquiring and retaining customers - Cultivating a high-performing workforce by investing in employee’s growth path Mr. Rungta is a Chartered Accountant from the Institute of Chartered Accountants of India and a bachelor’s in commerce from Mumbai University.\n","Name":"Alok Rungta","Designation":"Managing Director \u0026 CEO","Image":{"id":6668,"documentId":"brgx2v4u3zynjs21p5cvs0xg","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/3_a5a1e5484f.webp","alternativeText":null,"caption":null,"name":"3.webp"}}],"kmpList":[{"id":2886,"Description":"Alok Rungta is the Managing Director \u0026 CEO of Generali Central Life Insurance Company Limited (GCLIC) and is instrumental in transforming the Generali Central India Life’s vision of being a Lifetime Partner amongst all the internal and external stakeholders. Mr. Rungta is a veteran in the Insurance and Financial Services industry with over 25 years of experience, having held leadership roles across India and Southeast Asia, including the Philippines and Hong Kong. He has led initiatives across both Life and General Insurance businesses, notably at AXA, where he served as Asia Regional Financial Controller in Hong Kong and as Chief of Retail Propositions and Head of Health and Protection in the Philippines. His deep industry knowledge of the Indian insurance market makes him a proven leader. He has spearheaded numerous strategic initiatives in the following areas: - Leading transformational digitization initiatives within the organization - Growing a profitable distribution operation - Sales innovation for acquiring and retaining customers - Cultivating a high-performing workforce by investing in employee’s growth path Mr. Rungta is a Chartered Accountant from the Institute of Chartered Accountants of India and a bachelor’s in commerce from Mumbai University.\n","Name":"Alok Rungta","Designation":"Managing Director \u0026 CEO","Image":{"id":6668,"documentId":"brgx2v4u3zynjs21p5cvs0xg","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/3_a5a1e5484f.webp","alternativeText":null,"caption":null,"name":"3.webp"}},{"id":2887,"Description":"Aditya Mall is the Appointed Actuary at Generali Central Life Insurance Company Ltd., a position he has held since February 2023. In this role, he leads the actuarial function, focusing on policy offerings, regular valuations of policyholder liabilities, and ensuring the protection of policyholders' interests. Prior to this appointment, Aditya served as Vice President, Actuary, at Generali Central Life Insurance, contributing to the company's actuarial strategies and operations. \nHe joined the company in 2015 and has been instrumental in its growth and transformation.\nAditya is a Chartered Accountant and a Fellow of both the Institute and Faculty of Actuaries, UK, and the Institute of Actuaries of India. \nHe holds a Bachelor of Commerce in Accounting, Finance, and Taxation from St. Xavier's College. ","Name":"Aditya Mall","Designation":"Appointed Actuary","Image":{"id":593,"documentId":"dieu63jeyfk3r9zq35hxrykn","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/aditya_mall_1x_4368e12a49.webp","alternativeText":null,"caption":null,"name":"aditya_mall_1x.webp"}},{"id":2888,"Description":"Dinesh Arora is the Senior Vice President and Head of Internal Audit at Generali Central India Life insurance Company Limited. Dinesh joined the company in August 2016 and comes with 16+ years of experience in various business areas like, Internal Audit, Risk Management, Operations and Sales Strategy. At GCLI, he is responsible for preparing and implementing a risk-based audit plan to assess, report on, and make suggestions for improving the company’s key operational and financial activities and internal controls by giving an objective and evidence based opinion on all aspects of governance, risk management and internal control. He also plays an important role in delivering the organization’s strategic objectives by championing best practice in governance and objectively assessing the adequacy of governance and management of existing risks. Dinesh is a Chartered Accountant and a Certified Internal Auditor. He has previously worked in PwC, KPMG, Aviva Life Insurance and PNB MetLife prior to joining Generali Central India Life.","Name":"Dinesh Arora","Designation":"Executive Vice President \u0026\nHead Internal Audit","Image":{"id":594,"documentId":"au7ehmptgvgqt7nf4wvkvl5x","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/dinesh_arora_1x_ae6c917286.webp","alternativeText":null,"caption":null,"name":"dinesh_arora_1x.webp"}},{"id":2889,"Description":"Gaurav Garg is the Chief Strategy Officer \u0026 Chief of Staff at Generali Central Life Insurance, responsible for shaping long-term strategy and aligning it to enterprise-wide priorities. He drives insight-led decisions, executes high-impact initiatives, and leads strategic planning with rigor and structure. Gaurav also focuses on enhancing the overall effectiveness of the CEO’s office in delivering the organization’s long-term ambitions.\nWith over 20+ years of experience in Finance Leadership, Financial Planning \u0026 Analysis (FP\u0026A), Corporate Strategy, Distribution Strategy, Performance Management, and Business Transformation in the Insurance sector, he has led finance functions, driven profitability and strategic planning, overseen regulatory reporting, enabled digitization, managed growth and partnerships, and   distribution expansion while delivering sustainable outcomes. He has previously worked with Tata AIA Life Insurance, Bharti AXA General Insurance, Birla Sun Life Insurance, and Tata Consultancy Services.\nGaurav is a Chartered Accountant and Certified Information Systems Auditor (CISA).","Name":"Gaurav Garg","Designation":"Chief Strategy Officer \u0026 Chief of Staff","Image":{"id":6671,"documentId":"i2urz4dbnw7zezredzmj6dms","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/profile_a0e3c0d1fa.png","alternativeText":null,"caption":null,"name":"profile.png"}},{"id":2890,"Description":"Geetanjali Chugh Kothari is the Chief Marketing Officer and Head of Corporate Communications \u0026 Customer Experience at Generali Central Life Insurance, driving brand transformation and digital innovation to elevate customer engagement. With two decades of experience across India’s insurance, retail and media sectors, she has driven transformative initiatives that balance growth with purpose. Geetanjali spearheaded the strategic rebranding to Generali Central Life Insurance and champions industry efforts like the ‘Sabse Pehle Life Insurance’ campaign led by Insurance Awareness Committee- Life to bridge India’s protection gap. An accomplished marketing leader with multiple award wins, she is known for strong thought leadership and active participation in leading industry platforms. Prior to this, Geetanjali was with Bharti AXA Life Insurance and Bharti AXA General Insurance. Under her leadership, the company witnessed exceptional growth and garnered numerous accolades in marketing campaigns.  Earlier, at Future Group and Hindustan Times, she led high-impact brand initiatives and revenue-driving B2B and B2C properties for futurebazaar.com, HT Media and Fever 104 FM. Her ability to navigate challenges and capitalize on opportunities has earned her a reputation as a result-oriented marketing leader who blends creativity, resilience, and strategic clarity.\n","Name":"Geetanjali Chugh Kothari","Designation":"Chief Marketing Officer","Image":{"id":596,"documentId":"hk8fs5s01u0ey1w50yq5fx6j","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/geetanjali_chugh_kothari_1x_10b01f5865.webp","alternativeText":null,"caption":null,"name":"geetanjali_chugh_kothari_1x.webp"}},{"id":2891,"Description":"Manish Pahwa brings over 22 years of distinguished experience in corporate legal, secretarial, and compliance leadership across the insurance and financial services sectors. As the Chief Compliance Officer, he leads the Compliance, AML, and Fraud Control Unit.  \nManish has a proven track record of establishing robust legal and compliance frameworks from inception, having held senior leadership roles at Navi General Insurance, One97 Communications, and Generali Central India Insurance (General Insurance). His expertise spans regulatory compliance, corporate governance, risk management, and stakeholder engagement, with deep knowledge of IRDAI, RBI, and MCA regulations.\nHe is a qualified Company Secretary (ACS), Law graduate (LLB), and a Fellow of the Insurance Institute of India (FIII). Manish is known for his strategic foresight, ethical leadership, and ability to align compliance with business objectives while fostering a culture of integrity and accountability.","Name":"Manish Pahwa","Designation":"Chief Compliance Officer","Image":{"id":597,"documentId":"auq0vbjivxnnr3exuv76s4es","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/manish_pahwa_1x_cb58e5bc42.webp","alternativeText":null,"caption":null,"name":"manish_pahwa_1x.webp"}},{"id":2892,"Description":"Mohit Sharma is a seasoned leader with over 25 years of diverse experience across insurance and financial services, with a strong track record of driving growth, innovation, and enterprise‑wide business transformation.\nIn his current role as Chief Digital, AI \u0026 Transformation Officer, Mohit leads the Organization’s digital, data, AI, and transformation agenda across businesses and functions, with a focus on strengthening competitiveness and enabling future‑ready capabilities. His mandate spans enterprise‑wide digital and AI‑led transformation, aimed at improving operational effectiveness, decision‑making, and business scalability. He also leads the WiN (Women‑in‑Insurance) channel.\nKnown for his digital‑first mindset, Mohit has consistently championed the use of AI, automation, and advanced analytics to strengthen sales effectiveness, thereby helping customers better understand products and make informed purchase decisions through AI‑led sales enablement, smarter customer engagement, and simplified digital buying propositions.\nPrior to this, Mohit held leadership roles at ICICI Prudential Life Insurance, Tata AIG General Insurance, and Bharti AXA Life Insurance, where he played a key role in building, scaling, and transforming successful business verticals.\nMohit is a Mechanical Engineer and holds an MBA in Marketing from S.P. Jain Institute of Management and Research, Mumbai.","Name":"Mohit Sharma","Designation":"Chief Digital, AI \u0026 Transformation Officer","Image":{"id":598,"documentId":"zpdg1yvnh3c1shydawfyo3wq","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/mohit_sharma_1x_deb8ebb490.webp","alternativeText":null,"caption":null,"name":"mohit_sharma_1x.webp"}},{"id":2893,"Description":"Niraj Kumar is a seasoned financial services leader with over 24 years of experience spanning investment management, business strategy, and distribution. He has been associated with Generali Central Life Insurance for the past 10 years, where he has played a key role in strengthening the Organisation’s market position and driving business growth.\nIn his current role as Chief Distribution Officer – Proprietary Channels, Niraj leads the growth and performance of the company’s proprietary distribution ecosystem, with a sharp focus on accelerating scale while ensuring cost efficiency, operational excellence, and high-quality outcomes. He is responsible for fostering strong internal and external partnerships and implementing innovative, future-ready strategies to build customer-focused distribution models. \nNiraj brings strategic clarity and execution rigor to drive sustainable growth. He is an ardent believer in the power of diversity, inclusiveness \u0026 empowering the team.\nHe is an Economics graduate from the University of Delhi and holds an MBA degree in Finance from Symbiosis Institute of Business Management. He has also completed an Executive course in Finance from International Centre for Financial Asset Management and Engineering (FAME), Geneva. Before joining Generali Central Life Insurance, he worked with Aviva Life Insurance for close to 8 years as Head of Equities \u0026 Fund Manager. \nBefore joining the Insurance Industry, he also worked with a leading Mutual Fund, UTI MF for five and half years in various positions such as Co Fund Manager and Sector Analyst. He is a recipient of the ICRA Fund Award for the 'Best Fund Performer'.","Name":"Niraj Kumar","Designation":"Chief Distribution Officer – Proprietary Channels","Image":{"id":600,"documentId":"apchkvcxoee6kz2c92famrz5","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/niraj_kumar_1x_c4deb96eaa.webp","alternativeText":null,"caption":null,"name":"niraj_kumar_1x.webp"}},{"id":2894,"Description":"Puneet Kaur Kohli is the Chief Technology Officer (CTO) at Generali Central Life Insurance, where she spearheads the organization’s technology strategy with a sharp focus on enhancing IT capabilities and delivering impactful digital transformation.\nWith deep expertise in IT strategy, digital innovation, and enterprise transformation, Puneet continues to lead initiatives that enable sustainable growth and competitive advantage.\nShe has over 30 years of global experience, with a proven track record in driving technology-led innovation and operational excellence. Over her career, she has held leadership roles across diverse organizations, including Liberty General Insurance, Universal Sompo General Insurance, Manappuram Finance, Bajaj Capital, Motricity(AT\u0026amp;T), Soma Networks, Bharti Airtel, Carrier Aircon limited, Reliance Energy Limited (BSES) and Motorola.\nShe has been instrumental in driving digital transformation, building scalable IT frameworks, and aligning technology with business goals. Her contributions have been recognized with multiple industry awards, underscoring her impact and leadership in the tech space.\nShe holds a Bachelor of Technology from Delhi College of Engineering (1993), an MBA in Information Systems from the Faculty of Management Studies, Delhi (2002), and a Doctorate in Management (2018).","Name":"Puneet Kaur Kohli","Designation":"Chief Technology Officer","Image":{"id":6670,"documentId":"h64pn61jwmx1ic4wyv9wxdeg","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/2_475c183baf.webp","alternativeText":null,"caption":null,"name":"2.webp"}},{"id":2895,"Description":"Reena is a Human Resource professional with over 27 years of experience and has been in HR Leadership roles for over 17 years managing large and diverse teams. Reena is passionate about driving people agenda that is aligned with the strategic objectives of the organization, and nurturing a culture that enables people to perform at their best. She has rich experience in driving best-in-class employee experience, managing organizational transformations, and leading talent strategies to create future leaders.\nBefore joining Generali Central Life Insurance, Reena worked with Manipal Cigna, Bharti Airtel Ltd., and ABN AMRO Central Enterprise Services. She has a Bachelor's in Physics Honors from Delhi University and Master in Business Administration from the University of Indore, India.","Name":"Reena Tyagi","Designation":"Chief People \u0026 Organization Officer","Image":{"id":602,"documentId":"h7i9pt29xu8uz2gpga01hm6z","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/reena_tyagi_1x_0c54818d48.webp","alternativeText":null,"caption":null,"name":"reena_tyagi_1x.webp"}},{"id":2896,"Description":"Saddam Hossain is the Chief Risk Officer (CRO) at Generali Central Life Insurance. A seasoned industry veteran with over 18 years of expertise in the life insurance sector, Mr. Hossain possesses a distinguished track record spanning actuarial science, financial risk, and enterprise risk management. He is a Fellow Actuary and holds both an M.Tech and an M.Sc in Mathematics.\nAt Generali Central Life Insurance, he leads the company’s enterprise-wide risk framework, steering financial and non-financial risk, cyber security, capital optimization, and solvency management. Before joining Generali Central Life Insurance, Mr. Hossain spent a foundational period with SBI Life Insurance, followed by a highly successful 16-year tenure at Edelweiss Life Insurance, where he most recently served as Chief Risk Officer. His deep technical capabilities encompass statutory valuation, product pricing, asset-liability management (ALM), EV/VNB, risk-based capital, and regulatory reporting.\nAs a Fellow Actuary, Mr. Hossain actively shapes the Indian insurance landscape through his contributions to key regulatory initiatives, including the IRDAI Regulations Review Committee and the Risk-Based Capital Working Group. His exemplary work in risk governance has been recognized with the prestigious Golden Peacock Award for Risk Management.\n","Name":"Saddam Hossain","Designation":"Chief Risk Officer","Image":{"id":7211,"documentId":"tonhxe8sfe9ykmurasrjt04n","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/Saddam_a3bb17bbe0.webp","alternativeText":null,"caption":null,"name":"Saddam.webp"}},{"id":2897,"Description":"Sarvesh Kumar Mishra is the Head– Third Party Distribution at Generali Central Life Insurance. With extensive experience in the insurance industry, Sarvesh has established himself as a seasoned leader in Agency, bancassurance, partnership distribution, group \u0026 institutional sales, IMF, and business development. \nHis expertise lies in developing robust expansion frameworks, identifying high-potential locations, and streamlining branch operations to maximize impact and profitability. He also collaborates with various functions and stakeholders to design and implement effective sales strategies, policies, and processes, enabling sustained growth within the organization’s third-party distribution network.\nPrior to GCLI, Sarvesh was associated with PNB MetLife and Kotak Life. He holds a Master in Labour and Social Welfare","Name":"Sarvesh Kumar Mishra","Designation":"Chief Third Party Distribution Officer","Image":{"id":604,"documentId":"pvp4wql5vsx67dcidl9u9fys","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/sarvesh_kumar_mishra_1x_12ae2601a7.webp","alternativeText":null,"caption":null,"name":"sarvesh_kumar_mishra_1x.webp"}},{"id":2898,"Description":"Shobit Gupta is the Chief Investment Officer at Generali Central Life Insurance Company Limited, bringing over 25 years of rich experience across fixed income, asset allocation, foreign exchange, and macroeconomic markets. \nIn his current role, Shobit is responsible for overseeing the company’s investment strategy, managing its investment portfolio, and driving performance across asset classes. He also plays a key role in advancing asset–liability management practices and supporting the company’s long-term financial sustainability. \nA seasoned investment professional, Shobit has built a distinguished career spanning life insurance, asset management, and banking. He has consistently demonstrated strong expertise in building robust local investment capabilities, delivering stable and high-quality fund performance, and strengthening asset–liability management frameworks. His deep understanding of market dynamics, combined with a disciplined investment approach, has enabled him to drive long-term value creation across portfolios.","Name":"Shobit Gupta","Designation":"Chief Investment Officer","Image":{"id":6669,"documentId":"p9ufuk75sk5jne4tblguerxl","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/1_449c27d285.webp","alternativeText":null,"caption":null,"name":"1.webp"}},{"id":2899,"Description":"Sweta Bharucha is the General Counsel and Company Secretary at Generali Central India Life Company Ltd. She is responsible for Generali Central’s Legal, Corporate Governance and Regulatory Affairs.  Before assuming her current position, Sweta already had a rich experience in Governance, Legal, Secretarial and Compliance. She has worked with eminent organisations such as Aditya Birla Sunlife Insurance, Reliance Nippon Life Insurance, IndiaFirst Life Insurance Company and Magma HDI GI (Poonawalla Group).","Name":"Sweta Bharucha","Designation":"General Counsel \u0026 Company Secretary","Image":{"id":606,"documentId":"y4z14kzz98yo65gukdsnk7xe","url":"https://corporatewebsiteblobprod.blob.core.windows.net/cwprod/sweta_bharucha_1x_89d384e06f.webp","alternativeText":null,"caption":null,"name":"sweta_bharucha_1x.webp"}}]},"__N_SSG":true},"page":"/about-us","query":{},"buildId":"L2NOODfIMyE3c2H5TYg6s","isFallback":false,"isExperimentalCompile":false,"gsp":true,"scriptLoader":[]}</script></body></html>

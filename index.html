<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Insurance Products</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Every Indian life insurer's products, specs, riders, group plans, claim and grievance metrics and customer ratings, refreshed weekly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky ledger header + tab strip over one scrolling column (max 1280px); panels only around charts and tables. */
:root{
  --bg:#f1f4f1;          /* page plane: faint green-grey, like policy-bond security paper */
  --surface:#fbfcfa;     /* panels, chart surface */
  --surface-2:#e8ece7;   /* table heads, chips */
  --ink:#111a16;
  --ink-2:#46524d;
  --muted:#76837d;
  --line:#d8dfda;
  --line-strong:#bcc6c0;
  --accent:#0b6a5a;      /* policy green: links, active states, single-series marks */
  --accent-ink:#ffffff;
  --accent-wash:#d9ebe5;
  --stamp:#5a3db3;       /* rubber-stamp violet: administrative states (new, withdrawn, review) */
  --stamp-wash:#ece6fb;
  --emph-muted:#c3ccc7;  /* de-emphasised marks when an insurer is highlighted */
  --good-text:#006300; --crit-text:#b3312f; --warn-text:#8a5a00;
  --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100; --cat-5:#e87ba4; --cat-6:#008300;
  --seq-1:#e3eefb; --seq-2:#cde2fb; --seq-3:#9ec5f4; --seq-4:#6da7ec; --seq-5:#3987e5; --seq-6:#256abf; --seq-7:#184f95;
  --div-pos:#2a78d6; --div-neg:#e34948; --div-mid:#f0efec;  /* diverging pair: blue above zero, red below, gray midpoint */
  --on-cat-1:#ffffff; --on-cat-2:#0b0b0b; --on-cat-3:#0b0b0b; --on-cat-4:#0b0b0b; --on-cat-5:#0b0b0b; --on-cat-6:#ffffff;  /* label ink inside each categorical fill, whichever of white or near-black reads better */
  --on-pos:#ffffff; --on-neg:#0b0b0b;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1210; --surface:#141a17; --surface-2:#1c2420; --ink:#e7edea; --ink-2:#b1bdb7; --muted:#7d8a84;
    --line:#252f2b; --line-strong:#36423d; --accent:#3cb8a2; --accent-ink:#06120f; --accent-wash:#15332c;
    --stamp:#a593f2; --stamp-wash:#241e40; --emph-muted:#38433f;
    --good-text:#3ccb5a; --crit-text:#ef7b78; --warn-text:#f2b84b;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300;
    --seq-1:#18222d; --seq-2:#1b3150; --seq-3:#1d4a80; --seq-4:#2565b0; --seq-5:#3a86de; --seq-6:#6ea9ee; --seq-7:#a8cdf6;
    --div-pos:#3987e5; --div-neg:#e66767; --div-mid:#383835;
    --on-cat-1:#0b0b0b; --on-cat-2:#0b0b0b; --on-cat-3:#0b0b0b; --on-cat-4:#0b0b0b; --on-cat-5:#0b0b0b; --on-cat-6:#ffffff; --on-pos:#0b0b0b; --on-neg:#0b0b0b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1210; --surface:#141a17; --surface-2:#1c2420; --ink:#e7edea; --ink-2:#b1bdb7; --muted:#7d8a84;
  --line:#252f2b; --line-strong:#36423d; --accent:#3cb8a2; --accent-ink:#06120f; --accent-wash:#15332c;
  --stamp:#a593f2; --stamp-wash:#241e40; --emph-muted:#38433f;
  --good-text:#3ccb5a; --crit-text:#ef7b78; --warn-text:#f2b84b;
  --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300;
  --seq-1:#18222d; --seq-2:#1b3150; --seq-3:#1d4a80; --seq-4:#2565b0; --seq-5:#3a86de; --seq-6:#6ea9ee; --seq-7:#a8cdf6;
  --div-pos:#3987e5; --div-neg:#e66767; --div-mid:#383835;
  --on-cat-1:#0b0b0b; --on-cat-2:#0b0b0b; --on-cat-3:#0b0b0b; --on-cat-4:#0b0b0b; --on-cat-5:#0b0b0b; --on-cat-6:#ffffff; --on-pos:#0b0b0b; --on-neg:#0b0b0b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.75rem;letter-spacing:.005em}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0}
.mono{font-family:var(--font-mono);font-size:.86em;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.small{font-size:.82rem}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:relative;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
@media (min-width:761px){.top{position:sticky;top:env(safe-area-inset-top,0px)}}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;padding-block:14px 0}
.brand{flex:1 1 320px;min-width:0}
.brand h1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .sub{color:var(--ink-2);font-size:.86rem;margin-top:2px}
.bench{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ink-2);padding-bottom:6px}
.bench select{min-width:0;max-width:210px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;padding:9px 12px 10px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:.92rem;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:22px 110px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.view-head p{color:var(--ink-2);max-width:68ch;margin-top:6px}

/* form controls */
select,input[type="search"],input[type="text"]{background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;padding:7px 9px;font-size:.88rem;min-height:36px}
select{padding-right:26px}
input[type="search"]{min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;padding:7px 12px;font-size:.86rem;font-weight:500;min-height:36px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding-inline:8px}
.btn.ghost:hover{color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;font-size:inherit}

/* layout */
.grid{display:grid;gap:16px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.panel-head .t{min-width:0}
.panel-head .s{color:var(--muted);font-size:.8rem;margin-top:2px}
.section{margin-top:28px}
.section > h2{margin-bottom:12px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .v{font-size:1.85rem;font-weight:600;line-height:1.1;margin-top:4px}
.kpi .l{font-size:.8rem;color:var(--ink-2)}
.kpi .d{font-size:.75rem;color:var(--muted);margin-top:3px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:1.5rem}}

/* chips & stamps */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--ink-2);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.chip.on{background:var(--accent-wash);color:var(--ink)}
.stamp{display:inline-block;font:600 .68rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stamp);border:1.5px solid currentColor;border-radius:3px;padding:3px 6px 2px;white-space:nowrap}
.stamp.solid{background:var(--stamp-wash)}
.stamp.big{font-size:.8rem;padding:5px 9px 4px;transform:rotate(-2deg);border-width:2px}
.stamp.neutral{color:var(--muted)}
.catdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}

/* tables */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:.76rem;white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-wash)}
tr.bench td{background:color-mix(in srgb,var(--accent-wash) 70%,transparent)}
.sticky1 th:first-child,.sticky1 td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.sticky1 th:first-child{z-index:2;background:var(--surface-2)}
.sticky1 tbody tr.click:hover td:first-child{background:var(--accent-wash)}
.sticky1 tr.bench td:first-child{background:var(--accent-wash)}
th button.sort{background:none;border:0;padding:0;font:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center}
th button.sort[aria-sort="ascending"]::after{content:"↑"}
th button.sort[aria-sort="descending"]::after{content:"↓"}
.pname{font-weight:600;color:var(--ink);min-width:200px;max-width:320px}
.pname .ins{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.yes{color:var(--good-text)} .no{color:var(--muted)}
.cmpbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-weight:600;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.cmpbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.spec{font-size:.75rem;white-space:nowrap}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input[type="search"]{flex:1 1 220px}
.filters select{flex:0 1 auto;max-width:100%}
.resultbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:.84rem;color:var(--ink-2)}
details.filterbox > summary{list-style:none;cursor:pointer;display:inline-flex}
details.filterbox > summary::-webkit-details-marker{display:none}
@media (min-width:761px){details.filterbox > summary{display:none}}

/* charts */
.bars{display:flex;flex-direction:column;gap:5px}
.bar-row{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr);align-items:center;gap:10px;font-size:.82rem;border-radius:4px;padding:1px 0}
.bar-row .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar-row .lab.b{color:var(--ink);font-weight:600}
.bar-row .track{display:flex;align-items:center;gap:6px;min-width:0}
.bar-row .bar{height:14px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px;transition:filter .15s}
.bar-row .bar.mut{background:var(--emph-muted)}
.bar-row .val{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;font-size:.78rem}
.bar-row.click{cursor:pointer}
.bar-row.click:hover .bar,.bar-row.click:focus-visible .bar{filter:brightness(1.15)}
.bar-row.click:hover .lab{color:var(--ink)}
.stackrow{display:grid;grid-template-columns:minmax(96px,24%) minmax(0,1fr) 34px;align-items:center;gap:10px;font-size:.8rem}
.stackrow .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.stackrow .lab.b{color:var(--ink);font-weight:600}
.stack100{display:flex;gap:2px;height:16px;background:var(--surface)}
.stack100 > span{height:100%;min-width:2px}
.stack100 > span:first-child{border-radius:0}
.stack100 > span:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.svgchart{width:100%;display:block;overflow:visible}
.svgchart text{fill:var(--muted);font:11px var(--font-ui)}
.svgchart .lbl{fill:var(--ink-2);font-size:11px}
.svgchart .lbl.b{fill:var(--ink);font-weight:600}
.grid-line{stroke:var(--line);stroke-width:1}
.axis-line{stroke:var(--line-strong);stroke-width:1}
.med-line{stroke:var(--line-strong);stroke-width:1}
.dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.dot.mut{fill:var(--emph-muted)}
.svgchart .dot{pointer-events:none}
.hit{fill:transparent;cursor:pointer}
.hit:hover + .dot,.hit:focus + .dot{stroke:var(--ink)}
.cols{display:flex;align-items:flex-end;gap:2px;height:160px;padding-top:18px}
.col{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;height:100%}
.col .c{width:min(24px,80%);background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.col .c b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:500;color:var(--ink-2);padding-bottom:2px;font-variant-numeric:tabular-nums}
.col .x{font-size:.7rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.heat td.cell{text-align:center;font-variant-numeric:tabular-nums;cursor:pointer;min-width:52px;border-left:2px solid var(--surface)}
.heat td.cell:hover{outline:2px solid var(--ink);outline-offset:-2px}
.heat td.cell.zero{color:var(--muted);cursor:default}
.heat td.cell.zero:hover{outline:0}
.heat th.c{text-align:center;white-space:normal;min-width:64px;line-height:1.2}
.heat td.tot{font-weight:600;text-align:right}
.tbtoggle{font-size:.75rem}

/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:5px;padding:7px 9px;font-size:.78rem;line-height:1.35;max-width:260px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
#tip .tv{font-weight:600;font-size:.9rem}
#tip .tl{opacity:.8}

/* detail pages */
.crumbs{font-size:.84rem;margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;color:var(--muted)}
.dhead{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.dhead .main{flex:1 1 420px;min-width:0}
.dhead .ins{color:var(--ink-2);font-weight:500;margin-bottom:4px}
.dhead h1{font-size:1.9rem}
.dhead .desc{color:var(--ink-2);margin-top:10px;max-width:70ch}
.dhead .stamp{white-space:normal;line-height:1.4;max-width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.uin{display:inline-flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:5px;overflow:hidden;background:var(--surface)}
.uin > span{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-right:1px solid var(--line)}
.uin > span:last-child{border-right:0}
.uin b{font:500 1.05rem/1.1 var(--font-mono)}
.uin small{font-size:.66rem;color:var(--muted);margin-top:3px;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv > div{background:var(--surface);padding:10px 12px;min-width:0}
.kv dt{font-size:.74rem;color:var(--muted)}
.kv dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
dl{margin:0}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flag{font-size:.78rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2)}
.flag.y{border-color:var(--accent);color:var(--ink);background:var(--accent-wash)}
ul.feat{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.variants{display:flex;flex-direction:column;gap:8px}
.variants > div{border-left:2px solid var(--line-strong);padding-left:10px}
.sources{font-size:.8rem;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .l{font-size:.78rem;color:var(--ink-2)}
.tile .v{font-size:1.45rem;font-weight:600;margin-top:2px;line-height:1.2}
.tile .p{font-size:.72rem;color:var(--muted);margin-top:2px}
.tile .p.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:help}
td.desc{min-width:260px;max-width:460px;color:var(--ink-2);font-size:.82rem}
.tile .cmp{font-size:.76rem;margin-top:6px;display:flex;gap:5px;align-items:center}
.better{color:var(--good-text)} .worse{color:var(--crit-text)}
.theme-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}

/* compare */
.cmpgrid th[scope="row"]{background:var(--surface);color:var(--ink-2);font-weight:500;font-size:.8rem;white-space:normal;min-width:150px;position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}
.cmpgrid td{min-width:190px;max-width:280px}
.cmpgrid tr.grp th{background:var(--surface-2);color:var(--ink);font-family:var(--font-display);font-size:.85rem;letter-spacing:.02em}
.cmpgrid td.best{font-weight:600}
.cmpgrid td.best::after{content:" ●";color:var(--accent);font-size:.7em;vertical-align:middle}
.cmphead{display:flex;flex-direction:column;gap:6px}
.picker{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.picker .opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:.85rem}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--ink);color:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.tray .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.tray a{color:var(--bg);font-weight:600}
.tray .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--ink-2);background:var(--surface)}
.empty h3{margin-bottom:6px;color:var(--ink)}
.log{display:flex;flex-direction:column}
.logitem{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.logitem:last-child{border-bottom:0}
.logitem .date{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.logitem .what{display:flex;flex-direction:column;gap:3px;min-width:0}
.logitem .what .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:.82rem;color:var(--ink-2);background:var(--surface-2);border-radius:5px;padding:10px 12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:10px;color:var(--ink-2)}
.prose h3{color:var(--ink);margin-top:10px}
/* ownership, product analytics and the extra overview charts */
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1050px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid.eq{align-items:stretch}
.fn{font-size:.76rem;color:var(--muted);margin-top:10px;max-width:80ch}
.fn a{color:inherit}
.al-mid{transform:translateX(-50%)}
.al-start{transform:none}
.al-end{transform:translateX(-100%)}
.legend i.dotk{border-radius:50%}
.legend i.hollow{background:transparent;box-shadow:inset 0 0 0 2px var(--c,var(--accent))}
.hatch{background:repeating-linear-gradient(45deg,var(--line-strong) 0 2px,transparent 2px 6px)}
.legend i.hatch{box-shadow:inset 0 0 0 1px var(--line-strong)}
.lead{color:var(--ink-2);margin-top:12px;max-width:72ch}

/* collapsible section */
details.fold{margin-bottom:22px}
details.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
details.fold > summary::-webkit-details-marker{display:none}
details.fold[open] > summary{margin-bottom:16px}
.fold-s{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
.fold-k{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;font-size:.84rem;color:var(--ink-2);padding-top:4px}
.fold-k::before{content:"Show"}
details.fold[open] .fold-k::before{content:"Hide"}
.fold-k::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
details.fold[open] .fold-k::after{transform:translateY(2px) rotate(-135deg)}

/* 100% stacked rows */
.srow{display:grid;grid-template-columns:minmax(104px,30%) minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:.8rem}
.srow .lab{min-width:0;color:var(--ink-2);text-decoration:none;line-height:1.2;display:block}
.srow .lab .nm,.rc-lab .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .lab .sb,.rc-lab .sb{display:block;font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .lab.b .nm,.rc-lab.b .nm{color:var(--ink);font-weight:600}
.srow a.lab:hover .nm,a.rc-lab:hover .nm{color:var(--ink);text-decoration:underline}
.srow .tr{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:.78rem;white-space:nowrap}
.stack100 > span{transition:filter .15s}
.stack100 > span:hover{filter:brightness(1.12)}
.sax,.rc-axis{position:relative;height:18px;margin-top:4px}
.sax span,.rc-axis span{position:absolute;top:0;font-size:.7rem;line-height:1.3;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* tall segmented bar */
.tallbar{display:flex;gap:2px;height:28px}
.tallbar > .seg{height:100%;min-width:2px;border-radius:4px;display:flex;align-items:center;font:600 11.5px/1 var(--font-ui);white-space:nowrap;transition:filter .15s}
.tallbar > .seg b{font-weight:600;padding-left:7px}
.tallbar > .seg:hover,.tallbar > .seg:focus-visible{filter:brightness(1.12)}

/* share bars: a gauge out of 100% */
.shr{display:grid;grid-template-columns:minmax(110px,34%) minmax(0,1fr) 62px;align-items:center;gap:10px;font-size:.82rem;padding:9px 0;border-radius:4px}
.shr + .shr{border-top:1px solid var(--line)}
.shr:hover{background:color-mix(in srgb,var(--div-mid) 60%,transparent)}
.shr .g{height:14px;background:var(--surface-2);border-radius:0 4px 4px 0}
.shr .g > i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.shr .lab{color:var(--ink-2);min-width:0;line-height:1.25}
.shr .lab small{display:block;color:var(--muted);font-size:.7rem}
.shr .v{text-align:right;line-height:1.15;font-variant-numeric:tabular-nums}
.shr .v b{display:block;font-weight:600}
.shr .v small{color:var(--muted);font-size:.7rem}

/* row charts: labels on the left, marks on a shared scale */
.rc{display:grid;grid-template-columns:minmax(96px,28%) minmax(0,1fr);column-gap:10px}
.rc.wide{grid-template-columns:minmax(120px,36%) minmax(0,1fr)}
.rc-labs,.rc-plot{min-width:0}
.rc-lab{display:flex;flex-direction:column;justify-content:center;min-width:0;font-size:.8rem;line-height:1.25;color:var(--ink-2);text-decoration:none}
.rc-plot{position:relative}
.rc-gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
.rc-gl.zero{background:var(--line-strong)}
.rc-row{position:relative;border-radius:3px}
.rc-row.click{cursor:pointer}
.rc-row:hover{background:color-mix(in srgb,var(--div-mid) 60%,transparent)}
.rc-dot{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 2px var(--surface);pointer-events:none;z-index:2}
.rc-dot.hollow{background:var(--surface);box-shadow:inset 0 0 0 2px var(--c,var(--accent)),0 0 0 2px var(--surface)}
.rc-dot.hot,.rc-row.one:hover .rc-dot,.rc-row.one:focus-visible .rc-dot{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.rc-dot.hollow.hot{box-shadow:inset 0 0 0 2px var(--c,var(--accent)),0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.rc-dot.sm{width:8px;height:8px;margin:-4px 0 0 -4px}
.rc-dot.ia{pointer-events:auto;cursor:pointer}
.rc-dot.ia::after{content:"";position:absolute;inset:-7px;border-radius:50%}
.rc-dot.ia:hover{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.rc-guide{position:absolute;top:50%;left:0;height:1px;background:var(--line-strong);pointer-events:none}
.rc-bar{position:absolute;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--c,var(--accent));pointer-events:none}
.rc-bar.thin{height:2px;margin-top:-1px;background:var(--line-strong)}
.rc-t{position:absolute;top:50%;transform:translateY(-50%);font-size:.72rem;line-height:1;color:var(--ink-2);white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.rc-t.up{top:4px;transform:translateX(-50%)}
.rc-t.in{color:var(--on-pos)}
.rc-t.in.neg{color:var(--on-neg)}
.rc-med{position:absolute;top:6px;bottom:6px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink);pointer-events:none;z-index:3}
.rc-ref{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-2);opacity:.75;pointer-events:none;z-index:3}
.dvb{position:absolute;top:50%;height:14px;margin-top:-7px;min-width:2px;background:var(--c);pointer-events:none}
.dvb.pos{border-radius:0 4px 4px 0}
.dvb.neg{border-radius:4px 0 0 4px}
.dvb.mut{background:var(--emph-muted)}

/* FDI cap steps */
.fdi{position:relative;height:150px;margin:28px 0 0 34px}
.fdi-gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.fdi-yl{position:absolute;left:-34px;width:28px;text-align:right;font-size:.7rem;color:var(--muted);transform:translateY(50%);font-variant-numeric:tabular-nums;line-height:1}
.fdi-step{position:absolute;bottom:0;background:color-mix(in srgb,var(--accent) 10%,transparent);border-top:2px solid var(--accent);z-index:1}
.fdi-step::before{content:"";position:absolute;left:-1px;bottom:var(--p,0%);top:-2px;width:2px;background:var(--accent)}
.fdi-step::after{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.fdi-v{position:absolute;left:9px;top:-26px;font-size:.8rem;font-weight:600;color:var(--ink);white-space:nowrap}
.fdi-v.r{left:auto;right:6px}
.fdi-pt{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent),0 0 0 2px var(--surface);z-index:2}
.fdi-x{position:relative;height:18px;margin:8px 0 0 34px}
.fdi-x span{position:absolute;transform:translateX(-50%);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.fdi-list{list-style:none;margin:16px 0 0;padding:0}
.fdi-list li{display:grid;grid-template-columns:40px 44px minmax(0,1fr);gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:.86rem}
.fdi-list .yr{font:500 .84rem var(--font-mono);color:var(--ink-2)}
.fdi-list .cp{font-weight:600;font-variant-numeric:tabular-nums}
.fdi-list .ev{color:var(--ink-2);min-width:0}

/* partner countries */
.ctry{display:grid;grid-template-columns:minmax(96px,30%) minmax(0,1fr);gap:0 10px;font-size:.82rem;padding:5px 0;border-radius:4px}
.ctry + .ctry{border-top:1px solid var(--line)}
.ctry .lab{color:var(--ink);font-weight:600;min-width:0}
.ctry .track{display:flex;align-items:center;gap:6px;min-width:0}
.ctry .bar{height:14px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.ctry .val{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.78rem}
.ctry .names{grid-column:2;font-size:.74rem;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.ctry:hover{background:color-mix(in srgb,var(--div-mid) 60%,transparent)}

/* histogram axis */
.hist{display:flex;align-items:flex-end;gap:2px;height:130px;border-bottom:1px solid var(--line-strong)}
.hist > div{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-radius:4px 4px 0 0}
.hist > div:hover,.hist > div:focus-visible{background:color-mix(in srgb,var(--div-mid) 60%,transparent)}
.hist > div > b{font:600 .72rem/1 var(--font-ui);color:var(--ink-2);margin-bottom:3px;font-variant-numeric:tabular-nums}
.hist > div > i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.hist-ax{position:relative;height:18px;margin-top:6px}
.hist-ax span{position:absolute;top:0;transform:translateX(-50%);font-size:.7rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.holder-note{font-size:.76rem;color:var(--muted);display:block;margin-top:2px}
.pnote{display:block;font-size:.68rem;font-weight:400;color:var(--muted);margin-top:1px;white-space:nowrap}
@media (max-width:760px){
  h1{font-size:1.45rem}
  .dhead h1{font-size:1.5rem}
  .bench{padding-bottom:0}
  .panel{padding:12px}
  .logitem{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (max-width:560px){
  /* stacked bars: name and figure on one line, the bar full width beneath */
  .srow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"lab tr" "bar bar";row-gap:4px}
  .srow > .lab{grid-area:lab}
  .srow > .stack100{grid-area:bar}
  .srow > .tr{grid-area:tr;align-self:start}
  .srow.ax{grid-template-columns:minmax(0,1fr);grid-template-areas:none}
  .srow.ax > span{display:none}
  .srow:not(.ax){padding-bottom:6px}
  .rc{grid-template-columns:minmax(120px,34%) minmax(0,1fr)}
  .rc.wide{grid-template-columns:minmax(120px,36%) minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Insurance Products <span class="eyebrow" id="asof"></span></h1>
      <div class="sub">Every Indian life insurer: products and specs, riders, group plans, claims and grievance record, customer ratings, ownership.</div>
    </div>
    <label class="bench" for="bench"><span>Highlight insurer</span>
      <select id="bench" aria-label="Highlight insurer"><option value="">None</option></select>
    </label>
    <nav class="tabs" aria-label="Sections">
      <a href="#overview" data-v="overview">Overview</a>
      <a href="#insurers" data-v="insurers">Insurers</a>
      <a href="#ownership" data-v="ownership">Ownership</a>
      <a href="#products" data-v="products">Products</a>

      <a href="#changes" data-v="changes">Changes</a>
      <a href="#about" data-v="about">About the data</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view"><div class="loading">Loading the catalogue…</div></main>
<div class="tray" id="tray" hidden><div class="wrap"><span id="traytext"></span><span class="actions"><button class="btn" id="trayclear" type="button">Clear</button><a class="btn" href="#compare" id="traygo">Open compare</a></span></div></div>
<div id="tip" role="tooltip" hidden></div>
<script>
(() => {
"use strict";
const CAT_IND = ["Term","ULIP","Savings - Par","Savings - Non-Par","Pension & Annuity","Health & CI"];
const CAT_VAR = {"Term":"--cat-1","ULIP":"--cat-2","Savings - Par":"--cat-3","Savings - Non-Par":"--cat-4","Pension & Annuity":"--cat-5","Health & CI":"--cat-6"};
const METRICS = {
  nbp_cr:{l:"New business premium",f:"cr",b:"high"},
  nbp_market_share_pct:{l:"Share of industry new business",f:"pct",b:"high"},

  csr_amount_pct:{l:"Death claims settled (by amount)",f:"pct2",b:"high"},
  claims_repudiated_pct:{l:"Death claims repudiated",f:"pct2",b:"low"},
  grievances_per_10k:{l:"Grievances per 10,000 policies",f:"dec",b:"low"},
  grievances_total:{l:"Grievances reported",f:"int",b:"low"},
  ombudsman_complaints:{l:"Ombudsman complaints",f:"int",b:"low"},
  persistency_13m_pct:{l:"13th-month persistency",f:"pct",b:"high"},
  persistency_61m_pct:{l:"61st-month persistency",f:"pct",b:"high"},
  agents_count:{l:"Individual agents",f:"int"},
  branches_count:{l:"Branches",f:"int"},
  pat_cr:{l:"Profit after tax",f:"cr"},
  vnb_margin_pct:{l:"VNB margin",f:"pct"},
  ulip_share_pct:{l:"ULIP share of new business",f:"pct"},
  par_share_pct:{l:"Par share of new business",f:"pct"},
  nonpar_savings_share_pct:{l:"Non-par savings share",f:"pct"},
  protection_share_pct:{l:"Protection share",f:"pct"},
  annuity_share_pct:{l:"Annuity share",f:"pct"}
};
const TILE_KEYS = ["nbp_cr","nbp_market_share_pct","nbp_growth_pct","csr_count_pct","csr_amount_pct","claims_repudiated_pct","grievances_per_10k","ombudsman_complaints","solvency_ratio","aum_cr","persistency_13m_pct","persistency_61m_pct","gross_premium_cr","new_individual_policies","agents_count","branches_count","pat_cr","vnb_margin_pct","ulip_share_pct","par_share_pct","nonpar_savings_share_pct","protection_share_pct","annuity_share_pct","individual_nbp_cr","grievances_total"];
const CHANGE_TYPES = {
  launch:{l:"Launch",s:"new"}, new_version:{l:"New version",s:"revised"}, withdrawal:{l:"Withdrawal",s:"withdrawn"},
  new_uin:{l:"New UIN spotted",s:"review"}, missing_uin:{l:"UIN missing from list",s:"review"},
  rating_change:{l:"Rating change",s:"rating"}, spec_update:{l:"Spec update",s:"updated"},
  metric_update:{l:"Metric update",s:"updated"}, baseline:{l:"Baseline",s:"baseline"}, rename:{l:"Rename",s:"renamed"},
  page_failed:{l:"Source unreachable",s:"check"}
};
const UIN_TYPE = {N:"Non-linked",L:"Linked",B:"Rider",G:"Group",A:"Annuity"};

const S = {
  d:null, comp:{}, prod:{}, route:{v:"overview",id:null}, bench:"",
  f:{q:"",segment:"Individual",category:"",company:"",status:"Active",linkage:"",participation:"",need:"",online:""},
  sort:{k:"",dir:1}, shown:60, cmpP:[], cmpI:[], insSort:{k:"nbp_market_share_pct",dir:-1}, logType:"", logCo:"",
  ownType:"", ownCo:"", ownShown:25, anOpen:null
};

/* ---------- utilities ---------- */
const nfIN = new Intl.NumberFormat("en-IN");
const nf1 = new Intl.NumberFormat("en-IN",{maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat("en-IN",{maximumFractionDigits:2});
const $ = (sel, root=document) => root.querySelector(sel);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)){
    if (k == null || k === false || k === "") continue;
    e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, ...kids){
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){ if (v == null) continue; if (k === "text") e.textContent = v; else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k) e.append(k);
  return e;
}
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
function trimNum(x){ return nf2.format(Math.round(x*100)/100); }
function inr(n){
  if (n == null || isNaN(n)) return "—";
  if (n >= 1e7) return "₹" + trimNum(n/1e7) + " Cr";
  if (n >= 1e5) return "₹" + trimNum(n/1e5) + " L";
  return "₹" + nfIN.format(n);
}
function fmtMetric(key, v){
  if (v == null || isNaN(v)) return "—";
  const f = (METRICS[key]||{}).f;
  switch (f){
    case "cr": return "₹" + nfIN.format(Math.round(v)) + " Cr";
    case "pct": return nf1.format(v) + "%";
    case "pct2": return nf2.format(v) + "%";
    case "pcts": return (v > 0 ? "+" : "") + nf1.format(v) + "%";
    case "ratio": return nf2.format(v) + "×";
    case "dec": return nf1.format(v);
    case "int": return nfIN.format(Math.round(v));
    default: return nf2.format(v);
  }
}
function mval(c, key){ const m = c && c.metrics && c.metrics[key]; return m && typeof m.value === "number" ? m.value : null; }
function ageTxt(n){ if (n == null) return null; if (n < 1){ const d = Math.round(n*365); return d <= 31 ? d + " days" : Math.round(n*12) + " months"; } return trimNum(n); }
function entryAge(e){
  if (!e) return "—";
  const a = ageTxt(e.entry_age_min_years), b = ageTxt(e.entry_age_max_years);
  if (a == null && b == null) return "—";
  const unitA = a && /days|months/.test(a);
  if (b == null) return "from " + a + (unitA ? "" : " yrs");
  if (a == null) return "up to " + b + " yrs";
  return unitA ? `${a} – ${b} yrs` : `${a}–${b} yrs`;
}
function termTxt(e){
  if (!e) return "—";

// Beeswarm offsets: keep dots at least d px apart, nudging them up or down in 4px steps
function swarm(xs, d, maxOff){
  const order = xs.map((x, i) => i).sort((a, b) => xs[a] - xs[b]), placed = [], out = new Array(xs.length).fill(0);
  order.forEach(i => {
    const x = xs[i];
    let best = 0, bestOver = Infinity;
    for (let k = 0; k * 4 <= maxOff && bestOver > 0; k++){
      for (const sg of (k ? [1, -1] : [1])){
        const y = sg * k * 4;
        let over = 0;
        for (const p of placed){ const dist = Math.hypot(p.x - x, p.y - y); if (dist < d) over += d - dist; }
        if (over < bestOver){ bestOver = over; best = y; if (!over) break; }
      }
    }
    placed.push({x, y:best}); out[i] = best;
  });
  return out;
}

function growthCard(){

  if (rows.length < 3) return emptyPanel("New business growth", "Growth figures are not loaded yet.");
  const ind = S.d.industry && S.d.industry.metrics && S.d.industry.metrics.nbp_growth_pct, iv = ind ? num(ind.value) : null;
  const lo = Math.min(0, ...rows.map(r => r.v)), hi = Math.max(0, ...rows.map(r => r.v)), span = (hi - lo) || 1;
  const d0 = lo < 0 ? lo - span * 0.14 : 0, d1 = hi > 0 ? hi + span * 0.14 : 0, dd = (d1 - d0) || 1;
  const X = v => (v - d0) / dd * 100;

      axis: iv != null ? [{at:iv, text:`Industry ${fmtMetric("nbp_growth_pct", iv)}`, align:"start"}] : [],

/* ---------- product analytics ---------- */
const elig = p => p.eligibility || {};
const termOf = p => (p.category_details || {}).term || {};
const ulipOf = p => (p.category_details || {}).ulip || {};
const TERM_FEATURES = [
  {k:"rop_option", l:"Return of premium"},
  {k:"whole_life_cover_option", l:"Whole-life cover"},
  {k:"ci_or_accelerated_benefit", l:"Critical illness or accelerated benefit"},
  {k:"increasing_cover_option", l:"Increasing cover"}
];
// Answers are true/false or free text. Text counts as offered unless it says no, or only a separate rider is named.
function featState(v){
  if (v === true || v === false) return v;
  if (typeof v !== "string") return null;
  const s = v.trim().toLowerCase();
  if (!s) return null;
  if (/^(no|not|none|n\/a|nil)\b/.test(s) || /no standard/.test(s)) return false;
  const t = s.replace(/\bno (in-?built|built-?in)[^;.]*/g, "");
  if (/\brider/.test(t) && !/(in-?built|built-?in|accelerat|terminal|waiver|base plan|in base)/.test(t)) return false;
  return true;
}
const noun = (n, one, many) => `${nfIN.format(n)} ${n === 1 ? one : many || one + "s"}`;

function termFeaturesCard(act){
  const terms = act.filter(p => p.category === "Term");
  if (!terms.length) return emptyPanel("What term plans offer", "No term plans on sale are loaded yet.");
  const rows = TERM_FEATURES.map(f => {
    const st = terms.map(p => featState(termOf(p)[f.k])), yes = st.filter(x => x === true).length, no = st.filter(x => x === false).length, n = yes + no;
    return {l:f.l, yes, no, n, miss:terms.length - n, share: n ? yes / n * 100 : null};
  });
  if (rows.every(r => !r.n)) return emptyPanel("What term plans offer", "Term plan features are not loaded yet.");
  const chart = () => h("div", null,
    rows.map(r => {
      const row = h("div", {class:"shr", tabindex:"0"}, h("div", {class:"lab"}, r.l, h("small", null, `${r.n} of ${terms.length} plans recorded`)), h("div", {class:"g"}, r.share == null ? null : h("i", {style:`width:${r.share}%`})),
        h("div", {class:"v"}, h("b", null, r.share == null ? "—" : Math.round(r.share) + "%"), h("small", null, r.n ? `${r.yes} of ${r.n}` : "no data")));
      hover(row, () => [r.share == null ? "No data" : pc(r.share), r.l, r.n ? `${r.yes} of ${noun(r.n, "term plan")} with a recorded answer; ${r.miss} not recorded` : "No term plan has a recorded answer"]);
      return row;
    }),
    h("p", {class:"fn"}, `Of ${noun(terms.length, "term plan")} on sale. Each bar counts only the plans where the answer is recorded, shown under the figure. Written answers count as offered unless they say no or name only a separate rider.`));

      {l:"Claims and service", rows:["csr_count_pct","csr_amount_pct","claims_repudiated_pct","grievances_per_10k","ombudsman_complaints","persistency_13m_pct","persistency_61m_pct"].map(mrow)},
      {l:"Strength", rows:["solvency_ratio","pat_cr","vnb_margin_pct"].map(mrow)},
      {l:"Products on sale", rows:[{l:"Individual", v:c => (c.stats||{}).active_individual, num:c => (c.stats||{}).active_individual, best:"high"}, ...CAT_IND.map(k => ({l:k, v:c => ((c.stats||{}).by_category||{})[k] || 0})), {l:"Riders", v:c => (c.stats||{}).active_rider}, {l:"Group", v:c => (c.stats||{}).active_group}, {l:"Launched in 12 months", v:c => (c.stats||{}).launches_12m, num:c => (c.stats||{}).launches_12m, best:"high"}]},
      {l:"Customers", rows:[{l:"Android app rating", v:c => { const a = (c.reviews||{}).android; return a && a.rating != null ? `${nf1.format(a.rating)} ★ (${a.ratings_count ? nfIN.format(a.ratings_count) : "?"})` : null; }, num:c => ((c.reviews||{}).android||{}).rating, best:"high"}, {l:"iOS app rating", v:c => { const a = (c.reviews||{}).ios; return a && a.rating != null ? `${nf1.format(a.rating)} ★ (${a.ratings_count ? nfIN.format(a.ratings_count) : "?"})` : null; }, num:c => ((c.reviews||{}).ios||{}).rating, best:"high"}, {l:"WhatsApp servicing", v:c => yn(((c.reviews||{}).digital_servicing||{}).whatsapp)}, {l:"Top complaint theme", v:c => ((c.reviews||{}).negatives||[])[0]}]}
    ];
    groups.forEach(g => g.rows = g.rows.filter(r => is.some(c => { const v = r.v(c); return v != null && v !== "—"; })));
    iSec.append(cmpTable(cols, groups.filter(g => g.rows.length)));
  } else iSec.append(h("div", {class:"empty", style:"margin-top:10px"}, h("h3", null, "No insurers picked yet"), h("p", null, "Search above or tap + on the Insurers table.")));

}
function picker(kind){
  const input = h("input", {type:"search", id:"pick-" + kind, placeholder: kind === "P" ? "Add a product: type a name or UIN" : "Add an insurer: type a name", "aria-label": kind === "P" ? "Find a product to compare" : "Find an insurer to compare"});
  const out = h("div", {class:"picker"});
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2){ out.replaceChildren(); return; }
    const hits = kind === "P"
      ? products().filter(p => p.status_label === "Active" && ((p.name || "").toLowerCase().includes(q) || (p.uin || "").toLowerCase().includes(q) || cname(p.company_id).toLowerCase().includes(q))).slice(0, 8)
      : companies().filter(c => cname(c.id).toLowerCase().includes(q) || (c.legal_name || "").toLowerCase().includes(q)).slice(0, 8);
    out.replaceChildren(...hits.map(x => {
      const id = x.id, on = (kind === "P" ? S.cmpP : S.cmpI).includes(id);
      return h("div", {class:"opt"}, h("span", null, kind === "P" ? x.name : cname(id), h("span", {class:"muted small"}, kind === "P" ? ` · ${cname(x.company_id)} · ${x.category || x.segment}` : "")),
        h("button", {class:"btn" + (on ? " primary" : ""), type:"button", onclick: () => { toggleCmp(kind, id); render(); }}, on ? "Added" : "Add"));
    }));
  });
  return h("div", {style:"max-width:560px"}, input, out);
}

/* ---------- changes ---------- */
function viewChanges(){
  const view = h("div");
  const log = S.d.changelog || [];
  view.append(h("div", {class:"view-head"}, h("div", null, h("h2", null, "Change log"), h("p", null, "Every Monday a scheduled job re-reads each insurer's official product list and the app stores; a second pass researches anything new and updates the catalogue. Items marked ‘needs review’ were spotted automatically and are waiting for that check."))));
  const types = [...new Set(log.map(e => e.type))];
  const tsel = h("select", {id:"log-type", "aria-label":"Change type"}, h("option", {value:""}, "All change types"), types.map(t => { const o = h("option", {value:t}, (CHANGE_TYPES[t] || {l:t}).l); if (t === S.logType) o.selected = true; return o; }));
  tsel.addEventListener("change", () => { S.logType = tsel.value; render(); });
  const csel = h("select", {id:"log-co", "aria-label":"Insurer"}, h("option", {value:""}, "All insurers"), [...companies()].sort((a,b) => cname(a.id).localeCompare(cname(b.id))).map(c => { const o = h("option", {value:c.id}, cname(c.id)); if (c.id === S.logCo) o.selected = true; return o; }));
  csel.addEventListener("change", () => { S.logCo = csel.value; render(); });
  view.append(h("div", {class:"filters"}, tsel, csel));
  const list = log.filter(e => (!S.logType || e.type === S.logType) && (!S.logCo || e.company_id === S.logCo));
  view.append(list.length ? h("section", {class:"panel"}, h("div", {class:"log"}, list.slice(0, 300).map(changeItem))) : h("div", {class:"empty"}, h("h3", null, "Nothing logged for this filter"), h("p", null, "The weekly refresh adds launches, withdrawals and rating changes here.")));
  const lr = S.d.meta.last_refresh;
  view.append(h("p", {class:"small muted", style:"margin-top:12px"}, lr && lr.run_at ? `Last automated check: ${fmtDate((lr.run_at || "").slice(0,10))} · product lists read ${lr.product_pages ? lr.product_pages.ok + "/" + (lr.product_pages.ok + (lr.product_pages.failed || []).length) : "—"} · app ratings refreshed ${lr.ratings ? (lr.ratings.android_ok || 0) + " Android, " + (lr.ratings.ios_ok || 0) + " iOS" : "—"}.` : "The automated weekly check has not run yet."));
  return view;
}

/* ---------- about ---------- */
function viewAbout(){
  const m = S.d.meta, view = h("div");
  view.append(h("div", {class:"view-head"}, h("div", null, h("h2", null, "About the data"), h("p", null, `Built ${fmtDate((m.built_at || "").slice(0,10))} from public sources. Source code, raw data and CSV exports live in the GitHub repository.`)), h("div", {class:"actions"}, ext(m.repo, "Open repository ↗"))));
  const rows = companies().map(c => ({c, l:cname(c.id), n:(c.stats||{}).active_individual || 0, full:(c.stats||{}).full_spec_pct, r:(c.stats||{}).active_rider || 0, g:(c.stats||{}).active_group || 0, w:((c.stats||{}).withdrawn || 0) + ((c.stats||{}).superseded || 0), on:c.catalogue_researched_on, url:c.urls && c.urls.product_list_url}));
  view.append(h("div", {class:"grid g2"},
    h("section", {class:"prose"},
      h("h3", null, "What is covered"),
      h("p", null, "All 26 IRDAI-licensed life insurers — LIC and the private insurers, including the 2024 entrants and Sahara India Life (under administration, no new business) — plus India Post's Postal Life Insurance and Rural PLI, which sit outside IRDAI. For each: individual products on sale with eligibility, premium and benefit specs; riders; group products; and withdrawn products on record."),
      h("h3", null, "Where it comes from"),
      h("p", null, "Product data comes from each insurer's own product lists, product pages and brochures, with aggregator pages used only where an insurer's page could not be read (each product lists its sources). Company metrics come from the Life Insurance Council, IRDAI's annual report, the Insurance Ombudsman and insurers' public disclosures; each figure shows its period and source. App ratings come from Google Play and the App Store; review themes are summarised from app and review-site comments."),
      h("h3", null, "How it stays current"),
      h("p", null, "Mondays 08:00 IST: a GitHub Action re-reads every insurer's official product list for new or missing UINs and refreshes app ratings. Mondays mid-morning: a scheduled Claude session researches each flagged item, adds new products with full specs, confirms withdrawals, refreshes metrics when new periods are published, and re-checks a rotating set of insurers in depth."),
      h("h3", null, "Reading the specs"),
      h("p", null, "UIN is IRDAI's Unique Identification Number: insurer registration number, type letter (N non-linked, L linked), product number and version. ‘Replaced by new version’ means the same product number was refiled. ‘Spec’ shows how much of a product's detail was captured: full, partial, or listed only. Ages are in completed years; premiums exclude GST."),
      h("p", {class:"note"}, "Compiled from public information for comparison. Product terms change; confirm against the insurer's current brochure and policy wording before relying on any figure.")),
    h("section", null, h("h3", {style:"margin-bottom:10px"}, "Coverage by insurer"), h("div", {class:"tablewrap"}, h("table", {class:"sticky1"},
      h("thead", null, h("tr", null, h("th", null, "Insurer"), h("th", {class:"n"}, "Individual"), h("th", {class:"n"}, "Full spec"), h("th", {class:"n"}, "Riders"), h("th", {class:"n"}, "Group"), h("th", {class:"n"}, "Withdrawn"), h("th", null, "Researched"), h("th", null, "Product list"))),
      h("tbody", null, rows.map(r => h("tr", null, h("td", null, linkTo("insurer-" + r.c.id, r.l)), h("td", {class:"n"}, String(r.n)), h("td", {class:"n"}, r.full == null ? "—" : r.full + "%"), h("td", {class:"n"}, String(r.r)), h("td", {class:"n"}, String(r.g)), h("td", {class:"n"}, String(r.w)), h("td", {class:"small num"}, fmtDate(r.on)), h("td", {class:"small"}, r.url ? ext(r.url, host(r.url)) : "—")))))))));
  view.append(h("div", {class:"section"}, specCoverageCard()));
  return view;
}

function specCoverageCard(){
  const rows = companies().map(c => {
    const ps = activeInd(c.id), n = ps.length, cnt = k => ps.filter(p => (p.completeness || "list-only") === k).length;
    const full = cnt("full"), partial = cnt("partial"), listed = n - full - partial;
    return {id:c.id, l:cname(c.id), n, full, partial, listed, parts:{full:n ? full / n * 100 : 0, partial:n ? partial / n * 100 : 0, listed:n ? listed / n * 100 : 0}};
  }).filter(r => r.n).sort((a, b) => b.parts.full - a.parts.full || b.parts.partial - a.parts.partial || b.n - a.n || a.l.localeCompare(b.l));
  if (!rows.length) return emptyPanel("How much detail each insurer has", "No individual products on sale are loaded yet.");
  rows.forEach(r => { r.sub = `${r.n} on sale`; r.tr = String(r.n); });
  const segs = [{k:"full", l:"Full spec", color:"var(--seq-7)"}, {k:"partial", l:"Partial spec", color:"var(--seq-5)"}, {k:"listed", l:"Listed only", color:"var(--seq-4)"}];
  const tot = rows.reduce((a, r) => ({n:a.n + r.n, full:a.full + r.full, partial:a.partial + r.partial, listed:a.listed + r.listed}), {n:0, full:0, partial:0, listed:0});
  const segTip = (r, s, v) => [pc(v), `${r.l} · ${s.l}`, `${noun(r[s.k], "product")} of ${r.n} on sale`];
  return card("How much detail each insurer has", `Individual products on sale by how much of their spec was captured · ${nfIN.format(tot.full)} full, ${nfIN.format(tot.partial)} partial, ${nfIN.format(tot.listed)} listed only`,
    () => h("div", null, stackRows(rows, segs, {legend:segs.map(s => ({l:s.l, color:s.color})), segTip}),
      h("p", {class:"fn"}, "Spec shows how much of a product's detail was captured. Listed only means the product is known from the insurer's own list but its terms are not captured yet. The number at the end is the count on sale.")),
    () => simpleTable([{l:"Insurer", v:r => r.l}, {l:"On sale", n:1, v:r => String(r.n)}, {l:"Full spec", n:1, v:r => String(r.full)}, {l:"Partial spec", n:1, v:r => String(r.partial)}, {l:"Listed only", n:1, v:r => String(r.listed)}], rows));
}

function notFound(msg, back){ return h("div", {class:"empty"}, h("h3", null, msg), h("p", null, linkTo(back, "Back to the list"))); }

/* ---------- shell ---------- */
function setBench(id){ S.bench = id; ls.set("ip.bench", id); $("#bench").value = id; }
function updateTray(){
  const n = S.cmpP.length + S.cmpI.length;
  const tray = $("#tray");
  tray.hidden = !n || S.route.v === "compare";
  $("#traytext").textContent = [S.cmpP.length ? `${S.cmpP.length} product${S.cmpP.length > 1 ? "s" : ""}` : null, S.cmpI.length ? `${S.cmpI.length} insurer${S.cmpI.length > 1 ? "s" : ""}` : null].filter(Boolean).join(" · ") + " in compare";
}
function parseHash(){
  const raw = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if (raw.startsWith("insurer-")) return {v:"insurer", id:raw.slice(8)};
  if (raw.startsWith("product-")) return {v:"product", id:raw.slice(8)};
  return {v:["overview","insurers","ownership","products","compare","changes","about"].includes(raw) ? raw : "overview", id:null};
}
let lastKey = "";
function render(){
  if (!S.d) return;
  hideTip();
  const r = parseHash(); S.route = r;
  setTabs(r.v);
  const key = r.v + ":" + (r.id || "");
  const main = $("#view");
  let node;
  switch (r.v){
    case "insurers": node = viewInsurers(); break;
    case "insurer": node = viewInsurer(r.id); break;
    case "ownership": node = viewOwnership(); break;
    case "products": node = viewProducts(); break;
    case "product": node = viewProduct(r.id); break;
    case "compare": node = viewCompare(); break;
    case "changes": node = viewChanges(); break;
    case "about": node = viewAbout(); break;
    default: node = viewOverview();
  }
  const keepScroll = key === lastKey;
  const y = window.scrollY;
  main.replaceChildren(node);
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  lastKey = key;
  updateTray();
  const title = r.v === "product" && S.prod[r.id] ? S.prod[r.id].name : r.v === "insurer" && S.comp[r.id] ? cname(r.id) : null;
  document.title = title ? `${title} · Insurance Products` : "Insurance Products";
}
function init(d){
  S.d = d;
  d.companies.forEach(c => S.comp[c.id] = c);
  d.products.forEach(p => S.prod[p.id] = p);
  const saved = ls.get("ip.cmp", {P:[], I:[]});
  S.cmpP = (saved.P || []).filter(id => S.prod[id]); S.cmpI = (saved.I || []).filter(id => S.comp[id]);
  const bsel = $("#bench");
  [...d.companies].sort((a,b) => cname(a.id).localeCompare(cname(b.id))).forEach(c => bsel.append(h("option", {value:c.id}, cname(c.id))));
  const b = ls.get("ip.bench", ""); if (b && S.comp[b]) { S.bench = b; bsel.value = b; }
  bsel.addEventListener("change", () => { setBench(bsel.value); render(); });
  $("#asof").textContent = d.meta.data_as_of ? "Data as of " + fmtDate(d.meta.data_as_of) : "";
  $("#trayclear").addEventListener("click", () => { S.cmpP = []; S.cmpI = []; ls.set("ip.cmp", {P:[], I:[]}); updateTray(); if (S.route.v === "compare") render(); });
  window.addEventListener("hashchange", render);
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => document.querySelectorAll(".svgchart").forEach(svg => { const holder = svg.parentNode; if (holder && holder._redraw) holder._redraw(); }), 200); });
  render();
}
fetch("data/dashboard.json", {cache:"no-cache"})
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(init)
  .catch(err => { $("#view").replaceChildren(h("div", {class:"empty"}, h("h3", null, "The catalogue file did not load"), h("p", null, "Reload the page. If it keeps failing, the data file data/dashboard.json is missing from the published files (" + err.message + ")."))); });
})();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Life Insurance Benchmark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Every Indian life insurer in one league table: department grades, missions, head-to-head duels and badges, plus products, claims, ownership, strategy and news, refreshed daily.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&display=swap">
<style>
/* Layout: navy "season" band (brand, search, my company, section tabs) over one scrolling column (max 1280px).
   Colour roles: blue = data marks and links, saffron = my company, gold/silver/bronze = podium finishes, violet = rival side in a duel. */
:root{
  --bg:#eef1f8;          /* page plane: cool paper */
  --surface:#ffffff;     /* cards, chart surface */
  --surface-2:#e8ecf6;   /* table heads, chips, tracks */
  --ink:#0e1630;
  --ink-2:#3e4867;
  --muted:#687190;
  --line:#dbe0ec;
  --line-strong:#c0c8dc;
  --accent:#2453d4;      /* data blue: links, active states, single-series marks */
  --accent-ink:#ffffff;
  --accent-wash:#e4ebfd;
  --me:#e8590c;          /* saffron: my company, wherever it appears */
  --me-ink:#ffffff;
  --me-wash:#fff0e6;
  --me-text:#b4440a;
  --me-btn:#c2410c; --me-btn-ink:#ffffff;
  --rival:#7c3aed;
  --band:#0d1a45; --band-2:#1b2d74; --band-ink:#ffffff; --band-muted:#aab6de;
  --gold:#d9a21b; --gold-wash:#fdf4d8; --gold-text:#8a5d00; --silver:#9aa6bd; --bronze:#b8703f;
  --plat:#1aa3c4; --legend:#8b5cf6;
  --good:#1e9e57; --crit:#d9483f;
  --crest-1:#2251c9; --crest-2:#0f766e; --crest-3:#6d28d9; --crest-4:#b4235f; --crest-5:#a35a06; --crest-6:#15803d; --crest-7:#475569; --crest-8:#b23a16;
  --stamp:#5a3db3;       /* rubber-stamp violet: administrative states (new, withdrawn, review) */
  --stamp-wash:#ece6fb;
  --emph-muted:#cbd3e6;  /* de-emphasised marks when my company is highlighted */
  --good-text:#006300; --crit-text:#b3312f; --warn-text:#8a5a00;
  --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100; --cat-5:#e87ba4; --cat-6:#008300;
  --seq-1:#e3eefb; --seq-2:#cde2fb; --seq-3:#9ec5f4; --seq-4:#6da7ec; --seq-5:#3987e5; --seq-6:#256abf; --seq-7:#184f95;
  --div-pos:#2a78d6; --div-neg:#e34948; --div-mid:#eef0f4;  /* diverging pair: blue above zero, red below, gray midpoint */
  --on-cat-1:#ffffff; --on-cat-2:#0b0b0b; --on-cat-3:#0b0b0b; --on-cat-4:#0b0b0b; --on-cat-5:#0b0b0b; --on-cat-6:#ffffff;
  --on-pos:#ffffff; --on-neg:#0b0b0b;
  --shadow:0 1px 2px rgba(16,24,56,.06),0 10px 26px -20px rgba(16,24,56,.4);
  --shadow-lg:0 26px 50px -30px rgba(13,26,69,.6);
  --scrim:rgba(8,12,30,.55);
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Big Shoulders Display","Big Shoulders","Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
  --bnav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f22; --surface:#111936; --surface-2:#18224a; --ink:#e8ecf8; --ink-2:#b3bcd8; --muted:#7f89aa;
    --line:#222c52; --line-strong:#33406e; --accent:#7aa2ff; --accent-ink:#0a1130; --accent-wash:#1a2756;
    --me:#ff8a3d; --me-ink:#1a0b02; --me-wash:#3a1f0f; --me-text:#ffa361; --me-btn:#ff8a3d; --me-btn-ink:#1a0b02;
    --rival:#a78bfa;
    --band:#111c4a; --band-2:#1a2a6a; --band-ink:#ffffff; --band-muted:#a3b0db;
    --gold:#f2c14e; --gold-wash:#3a2f10; --gold-text:#f2c14e; --silver:#b9c3d8; --bronze:#d9925e;
    --plat:#4cc9f0; --legend:#b197fc; --good:#2fbf6b; --crit:#ef6461;
    --stamp:#a593f2; --stamp-wash:#241e40; --emph-muted:#2c3762;
    --good-text:#3ccb5a; --crit-text:#ef7b78; --warn-text:#f2b84b;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300;
    --seq-1:#18222d; --seq-2:#1b3150; --seq-3:#1d4a80; --seq-4:#2565b0; --seq-5:#3a86de; --seq-6:#6ea9ee; --seq-7:#a8cdf6;
    --div-pos:#3987e5; --div-neg:#e66767; --div-mid:#2a3355;
    --on-cat-1:#0b0b0b; --on-cat-2:#0b0b0b; --on-cat-3:#0b0b0b; --on-cat-4:#0b0b0b; --on-cat-5:#0b0b0b; --on-cat-6:#ffffff; --on-pos:#0b0b0b; --on-neg:#0b0b0b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -22px rgba(0,0,0,.8);
    --shadow-lg:0 26px 50px -30px rgba(0,0,0,.85);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0f22; --surface:#111936; --surface-2:#18224a; --ink:#e8ecf8; --ink-2:#b3bcd8; --muted:#7f89aa;
  --line:#222c52; --line-strong:#33406e; --accent:#7aa2ff; --accent-ink:#0a1130; --accent-wash:#1a2756;
  --me:#ff8a3d; --me-ink:#1a0b02; --me-wash:#3a1f0f; --me-text:#ffa361; --me-btn:#ff8a3d; --me-btn-ink:#1a0b02;
  --rival:#a78bfa;
  --band:#111c4a; --band-2:#1a2a6a; --band-ink:#ffffff; --band-muted:#a3b0db;
  --gold:#f2c14e; --gold-wash:#3a2f10; --gold-text:#f2c14e; --silver:#b9c3d8; --bronze:#d9925e;
  --plat:#4cc9f0; --legend:#b197fc; --good:#2fbf6b; --crit:#ef6461;
  --stamp:#a593f2; --stamp-wash:#241e40; --emph-muted:#2c3762;
  --good-text:#3ccb5a; --crit-text:#ef7b78; --warn-text:#f2b84b;
  --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300;
  --seq-1:#18222d; --seq-2:#1b3150; --seq-3:#1d4a80; --seq-4:#2565b0; --seq-5:#3a86de; --seq-6:#6ea9ee; --seq-7:#a8cdf6;
  --div-pos:#3987e5; --div-neg:#e66767; --div-mid:#2a3355;
  --on-cat-1:#0b0b0b; --on-cat-2:#0b0b0b; --on-cat-3:#0b0b0b; --on-cat-4:#0b0b0b; --on-cat-5:#0b0b0b; --on-cat-6:#ffffff; --on-pos:#0b0b0b; --on-neg:#0b0b0b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -22px rgba(0,0,0,.8);
  --shadow-lg:0 26px 50px -30px rgba(0,0,0,.85);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.noscroll{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--band)}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:2rem}
h2{font-size:1.75rem;text-transform:uppercase;letter-spacing:.025em}
h3{font-family:var(--font-ui);font-size:1.02rem;font-weight:700;line-height:1.25;letter-spacing:0}
p{margin:0}
.mono{font-family:var(--font-mono);font-size:.86em;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.small{font-size:.82rem}
.eyebrow{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header: the season band */
.top{position:relative;z-index:30;color:var(--band-ink);background:radial-gradient(70% 160% at 100% 0%,color-mix(in srgb,var(--me) 26%,transparent) 0,transparent 55%),linear-gradient(180deg,var(--band),var(--band-2))}
@media (min-width:761px){.top{position:sticky;top:env(safe-area-inset-top,0px)}}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px 0}
.brand{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.logo{flex:0 0 40px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),var(--me));color:#1a0d05;box-shadow:0 8px 20px -10px var(--me)}
.logo svg{width:24px;height:24px}
.bt{display:flex;flex-direction:column;min-width:0}
.bname{font:800 1.5rem/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;color:var(--band-ink);margin:0}
.bsub{font-size:.74rem;color:var(--band-muted);margin-top:4px;letter-spacing:.02em}
.hdr-actions{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.sbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 10px 0 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--band-ink) 22%,transparent);background:color-mix(in srgb,var(--band-ink) 8%,transparent);color:var(--band-muted);font-size:.85rem}
.sbtn:hover{color:var(--band-ink);border-color:color-mix(in srgb,var(--band-ink) 45%,transparent)}
.sbtn svg{width:17px;height:17px}
.sbtn kbd,.pal kbd{font:600 .7rem/1.4 var(--font-mono);border:1px solid currentColor;border-radius:5px;padding:0 6px;opacity:.75}
label.mine{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 6px 4px 5px;border-radius:12px;background:color-mix(in srgb,var(--band-ink) 8%,transparent);border:1px solid color-mix(in srgb,var(--me) 60%,transparent)}
.mycrest{display:inline-flex}
.mycrest > svg{width:22px;height:22px;color:var(--band-muted);margin:0 2px}
label.mine .mt{display:flex;flex-direction:column;min-width:0}
label.mine .bl{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--band-muted);font-weight:700;line-height:1.1;padding-left:2px}
label.mine select{color-scheme:dark;background:transparent;border:0;color:var(--band-ink);font-weight:700;font-size:.9rem;min-height:24px;padding:0 4px 0 2px;max-width:180px}
label.mine select option{color:var(--ink);background:var(--surface)}
label.bench{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ink-2)}
label.bench select{min-width:0;max-width:240px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;margin-top:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:10px 12px 11px;color:var(--band-muted);text-decoration:none;font-weight:600;font-size:.9rem;border-bottom:3px solid transparent}
.tabs a svg{width:15px;height:15px}
.tabs a:hover{color:var(--band-ink)}
.tabs a[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--me)}
.tabs a[aria-current="page"] svg{color:var(--me)}
main{padding-block:24px 120px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.view-head p{color:var(--ink-2);max-width:70ch;margin-top:8px}

/* form controls */
select,input[type="search"],input[type="text"]{background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:7px 9px;font-size:.88rem;min-height:36px}
select{padding-right:26px}
input[type="search"]{min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:7px 12px;font-size:.86rem;font-weight:600;min-height:36px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding-inline:8px}
.btn.ghost:hover{color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;font-size:inherit}

/* layout */
.grid{display:grid;gap:16px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.panel-head .t{min-width:0}
.panel-head .s{color:var(--muted);font-size:.8rem;margin-top:2px}
.section{margin-top:28px}
.section > h2{margin-bottom:12px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px 14px 18px;min-width:0}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 25%,transparent))}
.kpi .v{font:800 2.05rem/1.05 var(--font-display);margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kpi .l{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.kpi .d{font-size:.76rem;color:var(--ink-2);margin-top:4px}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:1.7rem}}

/* chips & stamps */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--ink-2);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.chip.on{background:var(--accent-wash);color:var(--ink)}
.stamp{display:inline-block;font:600 .68rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stamp);border:1.5px solid currentColor;border-radius:3px;padding:3px 6px 2px;white-space:nowrap}
.stamp.solid{background:var(--stamp-wash)}
.stamp.big{font-size:.8rem;padding:5px 9px 4px;transform:rotate(-2deg);border-width:2px}
.stamp.neutral{color:var(--muted)}
.catdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}

/* tables */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-weight:700;color:var(--ink-2);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-wash)}
tr.bench td{background:var(--me-wash)}
tr.bench td:first-child{box-shadow:inset 3px 0 0 var(--me)}
.sticky1 th:first-child,.sticky1 td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.sticky1 th:first-child{z-index:2;background:var(--surface-2)}
.sticky1 tbody tr.click:hover td:first-child{background:var(--accent-wash)}
.sticky1 tr.bench td:first-child{background:var(--me-wash);box-shadow:inset 3px 0 0 var(--me),1px 0 0 var(--line)}
th button.sort{background:none;border:0;padding:0;font:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center}
th button.sort[aria-sort="ascending"]::after{content:"↑"}
th button.sort[aria-sort="descending"]::after{content:"↓"}
.pname{font-weight:600;color:var(--ink);min-width:200px;max-width:320px}
.pname .ins{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.yes{color:var(--good-text)} .no{color:var(--muted)}
.cmpbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-weight:600;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.cmpbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.spec{font-size:.75rem;white-space:nowrap}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input[type="search"]{flex:1 1 220px}
.filters select{flex:0 1 auto;max-width:100%}
.resultbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:.84rem;color:var(--ink-2)}
details.filterbox > summary{list-style:none;cursor:pointer;display:inline-flex}
details.filterbox > summary::-webkit-details-marker{display:none}
@media (min-width:761px){details.filterbox > summary{display:none}}

/* charts */
.bars{display:flex;flex-direction:column;gap:5px}
.bar-row{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr);align-items:center;gap:10px;font-size:.82rem;border-radius:4px;padding:1px 0}
.bar-row .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar-row .lab.b{color:var(--ink);font-weight:600}
.bar-row .track{display:flex;align-items:center;gap:6px;min-width:0}
.bar-row .bar{height:14px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px;transition:filter .15s}
.bar-row .bar.mut{background:var(--emph-muted)}
.bar-row .bar.me{background:var(--me)}
.bar-row .val{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;font-size:.78rem}
.bar-row.click{cursor:pointer}
.bar-row.click:hover .bar,.bar-row.click:focus-visible .bar{filter:brightness(1.15)}
.bar-row.click:hover .lab{color:var(--ink)}
.stackrow{display:grid;grid-template-columns:minmax(96px,24%) minmax(0,1fr) 34px;align-items:center;gap:10px;font-size:.8rem}
.stackrow .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.stackrow .lab.b{color:var(--ink);font-weight:600}
.stack100{display:flex;gap:2px;height:16px;background:var(--surface)}
.stack100 > span{height:100%;min-width:2px}
.stack100 > span:first-child{border-radius:0}
.stack100 > span:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.svgchart{width:100%;display:block;overflow:visible}
.svgchart text{fill:var(--muted);font:11px var(--font-ui)}
.svgchart .lbl{fill:var(--ink-2);font-size:11px}
.svgchart .lbl.b{fill:var(--ink);font-weight:600}
.grid-line{stroke:var(--line);stroke-width:1}
.axis-line{stroke:var(--line-strong);stroke-width:1}
.med-line{stroke:var(--line-strong);stroke-width:1}
.dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.dot.mut{fill:var(--emph-muted)}
.dot.me{fill:var(--me)}
.svgchart .dot{pointer-events:none}
.hit{fill:transparent;cursor:pointer}
.hit:hover + .dot,.hit:focus + .dot{stroke:var(--ink)}
.cols{display:flex;align-items:flex-end;gap:2px;height:160px;padding-top:18px}
.col{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;height:100%}
.col .c{width:min(24px,80%);background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.col .c b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:500;color:var(--ink-2);padding-bottom:2px;font-variant-numeric:tabular-nums}
.col .x{font-size:.7rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.heat td.cell{text-align:center;font-variant-numeric:tabular-nums;cursor:pointer;min-width:52px;border-left:2px solid var(--surface)}
.heat td.cell:hover{outline:2px solid var(--ink);outline-offset:-2px}
.heat td.cell.zero{color:var(--muted);cursor:default}
.heat td.cell.zero:hover{outline:0}
.heat th.c{text-align:center;white-space:normal;min-width:64px;line-height:1.2}
.heat td.tot{font-weight:600;text-align:right}
.tbtoggle{font-size:.75rem}

/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:5px;padding:7px 9px;font-size:.78rem;line-height:1.35;max-width:260px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
#tip .tv{font-weight:600;font-size:.9rem}
#tip .tl{opacity:.8}

/* detail pages */
.crumbs{font-size:.84rem;margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;color:var(--muted)}
.dhead{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.dhead .main{flex:1 1 420px;min-width:0}
.dhead .ins{color:var(--ink-2);font-weight:500;margin-bottom:4px}
.dhead h1{font-size:2.3rem}
.dh-title{display:flex;gap:16px;align-items:center;min-width:0}
.dh-title > div{min-width:0}
.dhead .desc{color:var(--ink-2);margin-top:10px;max-width:70ch}
.dhead .stamp{white-space:normal;line-height:1.4;max-width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.uin{display:inline-flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:5px;overflow:hidden;background:var(--surface)}
.uin > span{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-right:1px solid var(--line)}
.uin > span:last-child{border-right:0}
.uin b{font:500 1.05rem/1.1 var(--font-mono)}
.uin small{font-size:.66rem;color:var(--muted);margin-top:3px;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv > div{background:var(--surface);padding:10px 12px;min-width:0}
.kv dt{font-size:.74rem;color:var(--muted)}
.kv dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
dl{margin:0}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flag{font-size:.78rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2)}
.flag.y{border-color:var(--accent);color:var(--ink);background:var(--accent-wash)}
ul.feat{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.variants{display:flex;flex-direction:column;gap:8px}
.variants > div{border-left:2px solid var(--line-strong);padding-left:10px}
.sources{font-size:.8rem;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;box-shadow:var(--shadow)}
.tile .l{font-size:.78rem;color:var(--ink-2)}
.tile .v{font:800 1.75rem/1.1 var(--font-display);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .p{font-size:.72rem;color:var(--muted);margin-top:2px}
.tile .p.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:help}
td.desc{min-width:260px;max-width:460px;color:var(--ink-2);font-size:.82rem}
.tile .cmp{font-size:.76rem;margin-top:6px;display:flex;gap:5px;align-items:center}
.better{color:var(--good-text)} .worse{color:var(--crit-text)}
.theme-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}

/* compare */
.cmpgrid th[scope="row"]{background:var(--surface);color:var(--ink-2);font-weight:500;font-size:.8rem;white-space:normal;min-width:150px;position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}
.cmpgrid td{min-width:190px;max-width:280px}
.cmpgrid tr.grp th{background:var(--surface-2);color:var(--ink);font-family:var(--font-display);font-size:.85rem;letter-spacing:.02em}
.cmpgrid td.best{font-weight:600}
.cmpgrid td.best::after{content:" ●";color:var(--accent);font-size:.7em;vertical-align:middle}
.cmphead{display:flex;flex-direction:column;gap:6px}
.picker{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.picker .opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:.85rem}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--band);color:var(--band-ink);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 24px -12px rgba(0,0,0,.4)}
.tray .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.tray a{color:var(--band-ink);font-weight:600}
.tray .btn{background:transparent;color:var(--band-ink);border-color:color-mix(in srgb,var(--band-ink) 40%,transparent)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--ink-2);background:var(--surface)}
.empty h3{margin-bottom:6px;color:var(--ink)}
.log{display:flex;flex-direction:column}
.logitem{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.logitem:last-child{border-bottom:0}
.logitem .date{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.logitem .what{display:flex;flex-direction:column;gap:3px;min-width:0}
.logitem .what .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:.82rem;color:var(--ink-2);background:var(--surface-2);border-radius:5px;padding:10px 12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:10px;color:var(--ink-2)}
.prose h3{color:var(--ink);margin-top:10px}
/* ownership, product analytics and the extra overview charts */
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1050px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid.eq{align-items:stretch}
.fn{font-size:.76rem;color:var(--muted);margin-top:10px;max-width:80ch}
.fn a{color:inherit}
.al-mid{transform:translateX(-50%)}
.al-start{transform:none}
.al-end{transform:translateX(-100%)}
.legend i.dotk{border-radius:50%}
.legend i.hollow{background:transparent;box-shadow:inset 0 0 0 2px var(--c,var(--accent))}
.hatch{background:repeating-linear-gradient(45deg,var(--line-strong) 0 2px,transparent 2px 6px)}
.legend i.hatch{box-shadow:inset 0 0 0 1px var(--line-strong)}
.lead{color:var(--ink-2);margin-top:12px;max-width:72ch}

/* collapsible section */
details.fold{margin-bottom:22px}
details.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
details.fold > summary::-webkit-details-marker{display:none}
details.fold[open] > summary{margin-bottom:16px}
.fold-s{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
.fold-k{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;font-size:.84rem;color:var(--ink-2);padding-top:4px}
.fold-k::before{content:"Show"}
details.fold[open] .fold-k::before{content:"Hide"}
.fold-k::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
details.fold[open] .fold-k::after{transform:translateY(2px) rotate(-135deg)}

/* 100% stacked rows */
.srow{display:grid;grid-template-columns:minmax(104px,30%) minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:.8rem}
.srow .lab{min-width:0;color:var(--ink-2);text-decoration:none;line-height:1.2;display:block}
.srow .lab .nm,.rc-lab .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .lab .sb,.rc-lab .sb{display:block;font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .lab.b .nm,.rc-lab.b .nm{color:var(--ink);font-weight:600}
.srow a.lab:hover .nm,a.rc-lab:hover .nm{color:var(--ink);text-decoration:underline}
.srow .tr{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:.78rem;white-space:nowrap}
.stack100 > span{transition:filter .15s}
.stack100 > span:hover{filter:brightness(1.12)}
.sax,.rc-axis{position:relative;height:18px;margin-top:4px}
.sax span,.rc-axis span{position:absolute;top:0;font-size:.7rem;line-height:1.3;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* tall segmented bar */
.tallbar{display:flex;gap:2px;height:28px}
.tallbar > .seg{height:100%;min-width:2px;border-radius:4px;display:flex;align-items:center;font:600 11.5px/1 var(--font-ui);white-space:nowrap;transition:filter .15s}
.tallbar > .seg b{font-weight:600;padding-left:7px}
.tallbar > .seg:hover,.tallbar > .seg:focus-visible{filter:brightness(1.12)}

/* share bars: a gauge out of 100% */
.shr{display:grid;grid-template-columns:minmax(110px,34%) minmax(0,1fr) 62px;align-items:center;gap:10px;font-size:.82rem;padding:9px 0;border-radius:4px}
.shr + .shr{border-top:1px solid var(--line)}
.shr:hover{background:color-mix(in srgb,var(--div-mid) 60%,transparent)}
.shr .g{height:14px;background:var(--surface-2);border-radius:0 4px 4px 0}
.shr .g > i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.shr .lab{color:var(--ink-2);min-width:0;line-height:1.25}
.shr .lab small{display:block;color:var(--muted);font-size:.7rem}
.shr .v{text-align:right;line-height:1.15;font-variant-numeric:tabular-nums}
.shr .v b{display:block;font-weight:600}
.shr .v small{color:var(--muted);font-size:.7rem}

/* row charts: labels on the left, marks on a shared scale */
.rc{display:grid;grid-template-columns:minmax(96px,28%) minmax(0,1fr);column-gap:10px}
.rc.wide{grid-template-columns:minmax(120px,36%) minmax(0,1fr)}
.rc-labs,.rc-plot{min-width:0}
.rc-lab{display:flex;flex-direction:column;justify-content:center;min-width:0;font-size:.8rem;line-height:1.25;color:var(--ink-2);text-decoration:none}
.rc-plot{position:relative}
.rc-gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
.rc-gl.zero{background:var(--line-strong)}
.rc-row{position:relative;border-radius:3px}
.rc-row.click{cursor:pointer}
.rc-row:hover{background:color-mix(in srgb,var(--div-mid) 60%,transparent)}
.rc-dot{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 2px var(--surface);pointer-events:none;z-index:2}
.rc-dot.hollow{background:var(--surface);box-shadow:inset 0 0 0 2px var(--c,var(--accent)),0 0 0 2px var(--surface)}
.rc-dot.hot,.rc-row.one:hover .rc-dot,.rc-row.one:focus-visible .rc-dot{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.rc-dot.hollow.hot{box-shadow:inset 0 0 0 2px var(--c,var(--accent)),0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.rc-dot.sm{width:8px;height:8px;margin:-4px 0 0 -4px}
.rc-dot.ia{pointer-events:auto;cursor:pointer}
.rc-dot.ia::after{content:"";position:absolute;inset:-7px;border-radius:50%}
.rc-dot.ia:hover{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.rc-guide{position:absolute;top:50%;left:0;height:1px;background:var(--line-strong);pointer-events:none}
.rc-bar{position:absolute;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--c,var(--accent));pointer-events:none}
.rc-bar.thin{height:2px;margin-top:-1px;background:var(--line-strong)}
.rc-t{position:absolute;top:50%;transform:translateY(-50%);font-size:.72rem;line-height:1;color:var(--ink-2);white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.rc-t.up{top:4px;transform:translateX(-50%)}
.rc-t.in{color:var(--on-pos)}
.rc-t.in.neg{color:var(--on-neg)}
.rc-med{position:absolute;top:6px;bottom:6px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink);pointer-events:none;z-index:3}
.rc-ref{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-2);opacity:.75;pointer-events:none;z-index:3}
.dvb{position:absolute;top:50%;height:14px;margin-top:-7px;min-width:2px;background:var(--c);pointer-events:none}
.dvb.pos{border-radius:0 4px 4px 0}
.dvb.neg{border-radius:4px 0 0 4px}
.dvb.mut{background:var(--emph-muted)}

/* FDI cap steps */
.fdi{position:relative;height:150px;margin:28px 0 0 34px}
.fdi-gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.fdi-yl{position:absolute;left:-34px;width:28px;text-align:right;font-size:.7rem;color:var(--muted);transform:translateY(50%);font-variant-numeric:tabular-nums;line-height:1}
.fdi-step{position:absolute;bottom:0;background:color-mix(in srgb,var(--accent) 10%,transparent);border-top:2px solid var(--accent);z-index:1}
.fdi-step::before{content:"";position:absolute;left:-1px;bottom:var(--p,0%);top:-2px;width:2px;background:var(--accent)}
.fdi-step::after{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.fdi-v{position:absolute;left:9px;top:-26px;font-size:.8rem;font-weight:600;color:var(--ink);white-space:nowrap}
.fdi-v.r{left:auto;right:6px}
.fdi-pt{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent),0 0 0 2px var(--surface);z-index:2}
.fdi-x{position:relative;height:18px;margin:8px 0 0 34px}
.fdi-x span{position:absolute;transform:translateX(-50%);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.fdi-list{list-style:none;margin:16px 0 0;padding:0}
.fdi-list li{display:grid;grid-template-columns:40px 44px minmax(0,1fr);gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:.86rem}
.fdi-list .yr{font:500 .84rem var(--font-mono);color:var(--ink-2)}
.fdi-list .cp{font-weight:600;font-variant-numeric:tabular-nums}
.fdi-list .ev{color:var(--ink-2);min-width:0}

/* partner countries */
.ctry{display:grid;grid-template-columns:minmax(96px,30%) minmax(0,1fr);gap:0 10px;font-size:.82rem;padding:5px 0;border-radius:4px}
.ctry + .ctry{border-top:1px solid var(--line)}
.ctry .lab{color:var(--ink);font-weight:600;min-width:0}
.ctry .track{display:flex;align-items:center;gap:6px;min-width:0}
.ctry .bar{height:14px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.ctry .val{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.78rem}
.ctry .names{grid-column:2;font-size:.74rem;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.ctry:hover{background:color-mix(in srgb,var(--div-mid) 60%,transparent)}

/* histogram axis */
.hist{display:flex;align-items:flex-end;gap:2px;height:130px;border-bottom:1px solid var(--line-strong)}
.hist > div{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-radius:4px 4px 0 0}
.hist > div:hover,.hist > div:focus-visible{background:color-mix(in srgb,var(--div-mid) 60%,transparent)}
.hist > div > b{font:600 .72rem/1 var(--font-ui);color:var(--ink-2);margin-bottom:3px;font-variant-numeric:tabular-nums}
.hist > div > i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.hist-ax{position:relative;height:18px;margin-top:6px}
.hist-ax span{position:absolute;top:0;transform:translateX(-50%);font-size:.7rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.holder-note{font-size:.76rem;color:var(--muted);display:block;margin-top:2px}
.pnote{display:block;font-size:.68rem;font-weight:400;color:var(--muted);margin-top:1px;white-space:nowrap}

/* benchmark, departments, strategy, news */
.kpi .v.vtext{font-size:1.2rem;line-height:1.25;overflow-wrap:anywhere}
.pillnav{margin:-4px 0 18px}
.pillnav .chip{text-decoration:none}
.pillnav .chip:hover{color:var(--ink);background:var(--accent-wash)}
.scorecard td.cell,.kpimatrix td.cell{min-width:58px}
.scorecard td.idx{font-weight:600;border-right:2px solid var(--surface)}
.scorecard th a,.kpimatrix th a{color:inherit;text-decoration:none}
.scorecard th a:hover,.kpimatrix th a:hover{color:var(--accent);text-decoration:underline}
.kpimatrix th.c{min-width:96px;max-width:140px;vertical-align:bottom}
.kpimatrix th.ctx{font-weight:500;color:var(--muted)}
.kpimatrix th .dir{display:block;font-weight:400;font-size:.66rem;color:var(--muted);margin-top:2px;white-space:normal}
.kpimatrix td.cell{white-space:nowrap;font-size:.8rem}
.tiles.leaders{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
a.tile.lead{text-decoration:none;color:var(--ink);display:block}
a.tile.lead:hover{border-color:var(--accent)}
.tile .lt{font-weight:700;font-size:1rem;margin-top:2px;line-height:1.25}
ol.top3{margin:8px 0 0;padding-left:20px;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
ol.top3 li span{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
ol.top3 li b{float:right;font-variant-numeric:tabular-nums}
ol.top3 li.b{font-weight:600}
.strat .panel{display:flex;flex-direction:column}
.strat-card.is-bench{border-color:var(--me);box-shadow:inset 0 3px 0 var(--me),var(--shadow)}
.strat-card .purpose{color:var(--ink-2);margin-top:2px}
.sblock{margin-top:12px}
.sblock .eyebrow{margin-bottom:6px}
.chip.good{background:color-mix(in srgb,var(--div-pos) 18%,var(--surface));color:var(--ink);text-decoration:none}
.chip.weak{background:color-mix(in srgb,var(--div-neg) 18%,var(--surface));color:var(--ink);text-decoration:none}
.dataview{border-top:1px solid var(--line);padding-top:10px}
svg.spark{display:block}
.trend .legend{margin-bottom:6px}
.bench-sec .kpis{margin-top:4px}
table.scorecard,table.kpimatrix{width:max-content;min-width:100%}
.scorecard td:first-child,.kpimatrix td:first-child,.scorecard th:first-child,.kpimatrix th:first-child{width:1%;white-space:nowrap}
.strat-card .chip,.bench-sec .chip{white-space:normal}
.strat-card{min-width:0;overflow-wrap:anywhere}
td.cell.bcol{box-shadow:inset 0 0 0 2px var(--ink)}
.pillnav.grouped{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-start}
.pgroup{display:flex;flex-direction:column;gap:4px;min-width:0}
.pfam{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip.all{align-self:flex-end;background:transparent;border:1px solid var(--line-strong);text-decoration:none}
.scorecard tr.famrow th{font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:0;padding-bottom:2px}
.scorecard th.fam{border-left:2px solid var(--surface)}
h3.famhead{margin:22px 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tiles.depttiles{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
a.tile.dept{text-decoration:none;color:var(--ink);display:flex;flex-direction:column}
a.tile.dept:hover{border-color:var(--accent)}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dscore{font-weight:600;font-size:.9rem;border-radius:5px;padding:2px 8px;font-variant-numeric:tabular-nums}
.dmeta{font-size:.74rem;color:var(--muted);margin-top:6px}
.install-tip{font-size:.8rem;color:var(--ink-2)}

/* ---------- game layer: crests, levels, grades, medals ---------- */
.crest{--cc:var(--crest-7);--cs:36px;flex:0 0 auto;display:inline-grid;place-items:center;width:var(--cs);height:var(--cs);border-radius:24% 24% 50% 50% / 20% 20% 46% 46%;background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 72%,#fff) 0,var(--cc) 52%,color-mix(in srgb,var(--cc) 74%,#000) 100%);color:#fff;font:800 calc(var(--cs) * var(--cf,.36))/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#fff 26%,transparent),0 2px 6px -2px rgba(0,0,0,.35);user-select:none}
.crest.me{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--me),0 6px 14px -6px var(--me)}
.crest.sm{--cs:26px}
.crest.lg{--cs:60px}
.crest.xl{--cs:84px}
.top .crest.me,.hero .crest.me{box-shadow:0 0 0 2px var(--band),0 0 0 4px var(--me),0 6px 18px -6px var(--me)}
.lvl{display:inline-flex;align-items:center;gap:6px;font:700 .7rem/1 var(--font-ui);letter-spacing:.07em;text-transform:uppercase;padding:5px 9px 5px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.lvl i{width:9px;height:9px;border-radius:2px;transform:rotate(45deg);background:var(--lc);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--lc) 35%,transparent)}
.lvl.on-band{background:color-mix(in srgb,var(--band-ink) 12%,transparent);color:var(--band-ink)}
.grade{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 6px;border-radius:10px;font:900 1.15rem/1 var(--font-display);letter-spacing:.02em}
.grade.none{background:var(--surface-2);color:var(--muted)}
.medal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font:900 .78rem/1 var(--font-display);color:#2a1a00;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0,transparent 42%),var(--mc);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.25);flex:0 0 auto}
.medal.g{--mc:var(--gold)} .medal.s{--mc:var(--silver)} .medal.b{--mc:var(--bronze)}
.medal.sm{width:15px;height:15px;font-size:0}
.medals{display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.mc{display:inline-flex;align-items:center;gap:4px;font:700 .82rem/1 var(--font-ui);font-variant-numeric:tabular-nums}
.medrow{display:inline-flex;gap:12px;align-items:center}
.medrow .mc{font:800 1.4rem/1 var(--font-display)}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn.me{background:var(--me-btn);border-color:var(--me-btn);color:var(--me-btn-ink);font-weight:700}
.btn.me:hover{filter:brightness(1.07);color:var(--me-btn-ink);border-color:var(--me-btn)}
.btn.onband{background:transparent;color:var(--band-ink);border-color:color-mix(in srgb,var(--band-ink) 30%,transparent)}
.btn.onband:hover{color:var(--band-ink);border-color:var(--band-ink)}
.star{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);flex:0 0 auto}
.star svg{width:18px;height:18px}
.star:hover{color:var(--gold-text);border-color:var(--gold)}
.star[aria-pressed="true"]{color:var(--gold-text);border-color:var(--gold);background:var(--gold-wash)}
.star[aria-pressed="true"] svg{fill:var(--gold);stroke:var(--gold)}
.wstar svg{width:14px;height:14px;fill:var(--gold);stroke:var(--gold);vertical-align:-2px}
.pbar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.pbar > i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent))}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 20px;flex-wrap:wrap;margin:34px 0 14px}
.shead p{color:var(--ink-2);font-size:.88rem;margin-top:6px;max-width:72ch}
.shead .chips{justify-content:flex-end}
.eyebrow-b{font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;color:var(--band-muted);font-weight:700}

/* hero: my company's dugout */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 24px;color:var(--band-ink);border:1px solid color-mix(in srgb,var(--band-ink) 10%,transparent);background:radial-gradient(80% 130% at 100% 0%,color-mix(in srgb,var(--me) 34%,transparent),transparent 56%),radial-gradient(70% 100% at 0% 100%,color-mix(in srgb,var(--accent) 38%,transparent),transparent 62%),linear-gradient(135deg,var(--band),var(--band-2));box-shadow:var(--shadow-lg)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 26px,color-mix(in srgb,var(--band-ink) 4%,transparent) 26px 27px)}
.hero > *{position:relative;z-index:1}
.hero a{color:var(--band-ink)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) auto minmax(0,1fr);gap:18px 30px;align-items:center}
.who{display:flex;gap:18px;align-items:center;min-width:0}
.whot{min-width:0;display:flex;flex-direction:column;gap:4px}
.hero .nm{font:800 2.3rem/1 var(--font-display);text-transform:uppercase;letter-spacing:.025em;overflow-wrap:break-word}
.hero .meta{color:var(--band-muted);font-size:.84rem}
.lvlrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.xpt{font-size:.78rem;color:var(--band-muted);font-variant-numeric:tabular-nums}
.xp{height:10px;border-radius:999px;background:color-mix(in srgb,var(--band-ink) 14%,transparent);overflow:hidden;margin-top:6px;max-width:380px}
.xp > i{display:block;height:100%;width:var(--w,0%);border-radius:inherit;background:linear-gradient(90deg,var(--me),var(--gold));box-shadow:0 0 12px color-mix(in srgb,var(--gold) 60%,transparent);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rankbig{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:0 6px}
.rankbig > span{font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;color:var(--band-muted);font-weight:700}
.rankbig > b{display:block;font:900 5.6rem/.9 var(--font-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;padding:2px 4px}
.rankbig .move{margin-top:4px}
.hstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hstat > div{background:color-mix(in srgb,var(--band-ink) 8%,transparent);border:1px solid color-mix(in srgb,var(--band-ink) 14%,transparent);border-radius:14px;padding:10px 12px;min-width:0}
.hstat .l{font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--band-muted);font-weight:700}
.hstat .v{font:800 1.75rem/1.05 var(--font-display);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hstat .d{font-size:.74rem;color:var(--band-muted);margin-top:2px;overflow-wrap:anywhere}
.move{display:inline-flex;align-items:center;gap:2px;font:800 .78rem/1 var(--font-ui);white-space:nowrap;font-variant-numeric:tabular-nums}
.move.up{color:var(--good-text)} .move.dn{color:var(--crit-text)} .move.eq{color:var(--muted)}
.hero .move.up{color:#6ee7a0} .hero .move.dn{color:#ff9b94} .hero .move.eq{color:var(--band-muted)}
@media (max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr) auto}.hero-grid .hx{grid-column:1 / -1}}
@media (max-width:560px){
  .hero{padding:18px 16px;border-radius:18px}
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .who{gap:14px}.crest.xl{--cs:62px}
  .hero .nm{font-size:1.9rem}
  .rankbig{flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;gap:4px 12px;padding:0}
  .rankbig > b{font-size:3.8rem}
  .hstat .v{font-size:1.45rem}
}

/* scoreboard stat cards */
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
a.stat{position:relative;display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
a.stat:hover{transform:translateY(-2px);border-color:var(--accent)}
.stat .l{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-right:44px}
.stat .v{font:800 1.9rem/1.05 var(--font-display);margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .d{font-size:.74rem;color:var(--ink-2);margin:2px 0 10px}
.rkp{position:absolute;top:10px;right:10px;font:900 1.05rem/1 var(--font-display);padding:5px 8px 4px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.rkp.top{background:linear-gradient(140deg,var(--gold),var(--bronze));color:#1a1204}

/* department power grid */
.pgrid{columns:240px 5;column-gap:10px}
.pfamh{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 0 8px;margin-top:10px;break-after:avoid;break-inside:avoid}
.pgrid > .pfamh:first-child{margin-top:0}
.pgrid > a.dcell{break-inside:avoid;margin-bottom:10px;width:100%}
a.dcell{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;row-gap:1px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 12px 12px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
a.dcell:hover{transform:translateY(-2px);border-color:var(--accent)}
a.dcell.off{opacity:.66;box-shadow:none}
.dcell .grade{grid-column:1;grid-row:1 / span 2}
.dcell .dn{grid-column:2;grid-row:1;font-weight:700;font-size:.88rem;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.dcell .dr{grid-column:2;grid-row:2;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dcell .medal,.dcell .dpos{grid-column:3;grid-row:1 / span 2}
.dpos{font:800 .95rem/1 var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums}
.dcell .pbar{grid-column:1 / -1;grid-row:3;margin-top:9px}

/* missions */
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
a.mission{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:7px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 14px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
a.mission::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--me),var(--gold))}
a.mission:hover{transform:translateY(-2px);border-color:var(--me)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mission .mt{font-weight:700;font-size:.98rem;line-height:1.25}
.mission .md{font-size:.8rem;color:var(--ink-2)}
.pips{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pips i{width:8px;height:8px;border-radius:2px;background:var(--line-strong)}
.pips i.on{background:var(--me)}
.pips b{margin-left:4px;font-weight:700}
.mprog{position:relative;height:8px;border-radius:999px;background:var(--surface-2);margin:4px 0 2px}
.mprog > i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--accent)}
.mprog > b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--me)}
.reward{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.reward span{font:700 .74rem/1 var(--font-ui);padding:6px 9px;border-radius:999px;background:var(--me-wash);color:var(--me-text);white-space:nowrap}
.reward span.xp2{background:var(--gold-wash);color:var(--gold-text)}

/* rivals */
.rivals{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rival{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.rtop{display:flex;align-items:center;gap:10px;min-width:0}
.rn{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.rn a{font-weight:700;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.rn a:hover{text-decoration:underline}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2)}
.vsn{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.vsn b{font:900 2.2rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.vsn.me b{color:var(--me-text)}
.vsn span{font-size:.72rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs .x{font:900 .9rem/1 var(--font-display);letter-spacing:.14em;color:var(--muted)}
.rival .btn{align-self:flex-start}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.hex{width:54px;height:60px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(150deg,var(--b1),var(--b2));color:#fff}
.hex svg{width:26px;height:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.badge.locked{box-shadow:none;background:transparent;border-style:dashed}
.badge.locked .hex{background:var(--surface-2);color:var(--muted)}
.badge.locked .hex svg{filter:none}
.badge .bn{font-weight:700;font-size:.84rem;line-height:1.2}
.badge .br{font-size:.72rem;color:var(--muted);line-height:1.3}
.badge .bh{font-size:.68rem;color:var(--ink-2);line-height:1.3}

/* intel feed */
.feed{display:flex;flex-direction:column}
.fitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.fitem:last-child{border-bottom:0}
.fitem .ft{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.fitem .ft a{color:var(--ink);text-decoration:none}
.fitem .ft a:hover{color:var(--accent);text-decoration:underline}
.fitem .fs{font-size:.74rem;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fitem .fd{font-size:.74rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
.chip.btnchip{border:0;cursor:pointer}

/* pick your company */
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.team{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:transform .15s,border-color .15s;text-align:center}
.team:hover{transform:translateY(-3px);border-color:var(--me)}
.team .tn{font-weight:700;line-height:1.2}
.team .ts{font-size:.72rem;color:var(--muted)}

/* league: season strip, podium, standings */
.season{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin:-4px 0 18px}
.stag{font:800 1rem/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--me-text)}
.months{display:inline-flex;gap:3px}
.months i{width:15px;height:8px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.months i.on{background:var(--accent);box-shadow:none}
.months i.now{background:var(--me);box-shadow:none}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;max-width:720px;margin:0 auto 8px}
a.pod{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;text-decoration:none;color:var(--ink);min-width:0}
.pod .pn{font-weight:700;font-size:.92rem;line-height:1.2;overflow-wrap:anywhere}
.pod .ps{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.plinth{width:100%;border-radius:14px 14px 4px 4px;display:flex;flex-direction:column;align-items:center;padding-top:12px;color:#1a1204;background:linear-gradient(180deg,var(--pc),color-mix(in srgb,var(--pc) 72%,#000));box-shadow:inset 0 2px 0 rgba(255,255,255,.35);margin-top:4px}
.plinth span{font:900 2.8rem/1 var(--font-display)}
.plinth small{font:700 .6rem/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;margin-top:4px;opacity:.8}
.pod.p1 .plinth{height:150px;--pc:var(--gold)}
.pod.p2 .plinth{height:112px;--pc:var(--silver)}
.pod.p3 .plinth{height:88px;--pc:var(--bronze)}
a.pod:hover .plinth{filter:brightness(1.07)}
table.league td{vertical-align:middle}
.lteam{display:flex;align-items:center;gap:10px;min-width:200px}
.lrank{font:900 1.35rem/1 var(--font-display);min-width:26px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.lteam a{font-weight:700;color:var(--ink);text-decoration:none}
.lteam a:hover{text-decoration:underline}
.lteam .pnote{white-space:nowrap}
.ibar{display:flex;align-items:center;gap:8px;min-width:150px}
.ibar > span{flex:1 1 auto;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.ibar > span > i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.ibar > b{font:800 1.1rem/1 var(--font-display);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
tr.bench .ibar > span > i{background:var(--me)}
.form{display:inline-flex;gap:3px}
.form i{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font:800 .62rem/1 var(--font-ui);font-style:normal;color:#fff;cursor:default}
.form i.w{background:var(--good)} .form i.l{background:var(--crit)} .form i.d{background:var(--line-strong);color:var(--ink)}
ol.top3{list-style:none;padding-left:0}
ol.top3 li{display:flex;align-items:center;gap:8px}
ol.top3 li span:not(.medal){flex:1 1 auto;max-width:none}
ol.top3 li b{float:none;margin-left:auto}

/* duel */
.hero.duel{padding:22px 20px}
.duelhead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center}
.dside{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.dside select{color-scheme:light;background:var(--surface);color:var(--ink);font-weight:700;max-width:100%}
.dmid{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.dsc{display:flex;gap:12px;align-items:center;font:900 4.8rem/.9 var(--font-display);font-variant-numeric:tabular-nums}
.dsc .dash{font-size:2.2rem;color:var(--band-muted)}
.dsc b.wn{color:var(--gold)}
.wtag{display:inline-flex;align-items:center;gap:6px;font:700 .82rem/1.2 var(--font-ui);color:var(--gold)}
.wtag svg{width:16px;height:16px}
@media (max-width:620px){
  .duelhead{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a b" "m m"}
  .duelhead > .dside:first-child{grid-area:a}
  .duelhead > .dside:last-child{grid-area:b}
  .duelhead > .dmid{grid-area:m}
  .dsc{font-size:3.6rem}
}
.bfly{display:grid;grid-template-columns:minmax(0,1fr) minmax(86px,150px) minmax(0,1fr);gap:7px 10px;align-items:center}

function niceTicks(lo, hi, n=5){

function scatter(points, {xKey, yKey, xLabel, yLabel, xFmt, yFmt, yFit, tip}){

    x0 = Math.floor(x0 - (x1-x0)*0.08 - 0.1); x1 = Math.min(100.2, Math.max(x1 + (x1-x0)*0.05, x0 + 1));

    const yMax = yFit ? y1 : (yt[yt.length-1] || 1);

// Beeswarm offsets: keep dots at least d px apart, nudging them up or down in 4px steps
function swarm(xs, d, maxOff){
  const order = xs.map((x, i) => i).sort((a, b) => xs[a] - xs[b]), placed = [], out = new Array(xs.length).fill(0);
  order.forEach(i => {
    const x = xs[i];
    let best = 0, bestOver = Infinity;
    for (let k = 0; k * 4 <= maxOff && bestOver > 0; k++){
      for (const sg of (k ? [1, -1] : [1])){
        const y = sg * k * 4;
        let over = 0;
        for (const p of placed){ const dist = Math.hypot(p.x - x, p.y - y); if (dist < d) over += d - dist; }
        if (over < bestOver){ bestOver = over; best = y; if (!over) break; }
      }
    }
    placed.push({x, y:best}); out[i] = best;
  });
  return out;
}

const OWN_GROUP = {"Foreign partner":"foreign", "Indian promoter":"domestic", "Bank":"domestic", "Government":"domestic"};

const OWN_EVENT_ORDER = ["Entry", "Stake increase", "Stake decrease", "Exit", "Merger", "Listing", "Rename"];
const DERIVED_NOTE = "Indian-side stakes marked balance, derived are worked out as 100% minus IRDAI's foreign share. They are not filed shareholdings.";
const ownKind = t => OWN_GROUP[t] || "public";
const clip = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s; };

function foreignOf(c){ const o = ownObj(c); return o ? num(o.foreign_stake_pct) : null; }
function holderBase(n){ return String(n || "").replace(/\s*\(balance,\s*derived\)/i, "").trim(); }
function holderShort(s){ return shortName(holderBase(s.name)) + (s.derived ? " (balance)" : ""); }
function asOfText(a){ return a ? fmtDate(a) : "date not stated"; }
function asOfRange(list){
  const v = [...new Set(list.filter(Boolean))].sort();
  return !v.length ? "" : v.length === 1 ? fmtDate(v[0]) : `${fmtDate(v[0])} to ${fmtDate(v[v.length - 1])}`;
}
function ownInfo(c){
  const o = ownObj(c);
  if (!o) return null;
  const holders = arr(o.shareholders).map(s => ({name:String((s && s.name) || "Unnamed holder"), type:String((s && s.type) || "Other"), country:(s && s.country) || "", stake:num(s && s.stake_pct), asOf:(s && s.as_of) || "", source:(s && s.source) || "", derived:/balance,\s*derived/i.test(String((s && s.name) || ""))}))
    .filter(s => s.stake != null).sort((a, b) => b.stake - a.stake);
  let partners = arr(o.foreign_partners).map(p => ({name:String((p && p.name) || "Foreign partner"), country:(p && p.country) || "Not stated", stake:num(p && p.stake_pct), since:(p && p.since) || null}));
  if (!partners.length) partners = holders.filter(s => s.type === "Foreign partner").map(s => ({name:s.name, country:s.country || "Not stated", stake:s.stake, since:null}));
  const parts = {foreign:0, domestic:0, public:0, rest:0};
  holders.forEach(s => { parts[ownKind(s.type)] += s.stake; });
  const tot = parts.foreign + parts.domestic + parts.public;
  if (holders.length && 100 - tot >= 1) parts.rest = 100 - tot;
  const foreign = num(o.foreign_stake_pct), fh = holders.find(s => s.type === "Foreign partner");
  return {
    holders, partners, parts, foreign, foreignAsOf: fh ? fh.asOf : "",

    parentFpi: holders.some(s => /listed parent/i.test(s.name)),

const partnerCountry = p => p.country && p.country !== "Not stated" ? p.country : "";

  const first = tl[0].year, end = Math.max(tl[tl.length - 1].year, new Date().getFullYear()) + 1, span = end - first;

const elig = p => p.eligibility || {};

  {k:"rop_option", l:"Return of premium"},

  {k:"increasing_cover_option", l:"Increasing cover"}

// Answers are true/false or free text. Text counts as offered unless it says no, or only a separate rider is named.
function featState(v){
  if (v === true || v === false) return v;
  if (typeof v !== "string") return null;
  const s = v.trim().toLowerCase();
  if (!s) return null;
  if (/^(no|not|none|n\/a|nil)\b/.test(s) || /no standard/.test(s)) return false;
  const t = s.replace(/\bno (in-?built|built-?in)[^;.]*/g, "");
  if (/\brider/.test(t) && !/(in-?built|built-?in|accelerat|terminal|waiver|base plan|in base)/.test(t)) return false;
  return true;
}
const noun = (n, one, many) => `${nfIN.format(n)} ${n === 1 ? one : many || one + "s"}`;

    return {l:f.l, yes, no, n, miss:terms.length - n, share: n ? yes / n * 100 : null};
  });

        h("div", {class:"v"}, h("b", null, r.share == null ? "—" : Math.round(r.share) + "%"), h("small", null, r.n ? `${r.yes} of ${r.n}` : "no data")));

      return row;

/* missions: the top-quartile mark on one KPI, and what reaching it would do to the index */
const MISSION_UNITS = new Set(["pct", "pp", "bps", "x", "stars", "score", "per10k", "days", "secs", "inr_lakh"]);
const DIFF = ["", "Quick win", "Stretch", "Moonshot"];

  const pids = Object.keys(mine), tot = sum(pids.map(p => mine[p])), np = pids.length;
  const others = Object.entries(sc.idx).filter(([c]) => c !== cid).map(([, x]) => x.score), set = new Set(sc.ids), out = [];
  scoredPillars().forEach(p => {
    if (mine[p.id] == null) return;
    const ks = p.kpis.filter(k => sc.ks[k.id] && sc.ks[k.id][cid] != null);
    ks.forEach(k => {
      const m = kmeta(k.id) || k, cur = sc.ks[k.id][cid];
      if (cur >= 70 || !MISSION_UNITS.has(m.unit) || (m.better !== "high" && m.better !== "low")) return;
      const vals = Object.entries(S.b.values[k.id] || {}).filter(([c, y]) => set.has(c) && typeof y.v === "number").map(([, y]) => y.v).sort((a, b) => a - b);

    });
  });
  out.sort((a, b) => b.gain - a.gain);

  [1, 2, 3].forEach(d => out.filter(x => x.diff === d).slice(0, 2).forEach(take));
  out.forEach(take);
  return pick.sort((a, b) => a.diff - b.diff || b.gain - a.gain);
}

  return nav;
}
function updateMyCrest(){ const slot = $("#mycrest"); if (slot) slot.replaceChildren(S.bench && S.comp[S.bench] ? crestOf(S.bench, "sm") : icon("flag")); }

/* ---------- shell ---------- */
function setBench(id){ S.bench = id; ls.set("ip.bench", id); $("#bench").value = id; updateMyCrest(); }
function updateTray(){
  const n = S.cmpP.length + S.cmpI.length;
  const tray = $("#tray");
  tray.hidden = !n || S.route.v === "compare";
  $("#traytext").textContent = [S.cmpP.length ? `${S.cmpP.length} product${S.cmpP.length > 1 ? "s" : ""}` : null, S.cmpI.length ? `${S.cmpI.length} insurer${S.cmpI.length > 1 ? "s" : ""}` : null].filter(Boolean).join(" · ") + " in compare";
}
function parseHash(){
  const raw = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if (raw.startsWith("insurer-")) return {v:"insurer", id:raw.slice(8)};
  if (raw.startsWith("product-")) return {v:"product", id:raw.slice(8)};
  if (raw.startsWith("dept-")) return {v:"dept", id:raw.slice(5)};
  if (raw.startsWith("kpi-")) return {v:"kpi", id:raw.slice(4)};
  if (raw === "duel" || raw.startsWith("duel-")) return {v:"duel", id:raw.slice(5) || null};
  return {v:["home","overview","benchmark","departments","network","global","strategy","news","insurers","ownership","products","compare","changes","about"].includes(raw) ? raw : "home", id:null};
}
let lastKey = "";
function render(){
  if (!S.d) return;
  hideTip();
  const r = parseHash(); S.route = r;
  setTabs(r.v);
  const key = r.v + ":" + (r.id || "");
  const main = $("#view");
  let node;
  switch (r.v){
    case "benchmark": node = viewBenchmark(); break;
    case "dept": node = viewDept(r.id); break;
    case "departments": node = viewDeptHome(); break;
    case "kpi": node = viewKpi(r.id); break;
    case "network": node = viewNetwork(); break;
    case "global": node = viewGlobal(); break;
    case "strategy": node = viewStrategy(); break;
    case "news": node = viewNews(); break;
    case "insurers": node = viewInsurers(); break;
    case "insurer": node = viewInsurer(r.id); break;
    case "ownership": node = viewOwnership(); break;
    case "products": node = viewProducts(); break;
    case "product": node = viewProduct(r.id); break;
    case "compare": node = viewCompare(); break;
    case "changes": node = viewChanges(); break;
    case "about": node = viewAbout(); break;
    case "overview": node = viewOverview(); break;
    case "duel": node = viewDuel(r.id); break;
    default: node = viewHome();
  }
  const keepScroll = key === lastKey;
  const y = window.scrollY;
  main.replaceChildren(node);
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  lastKey = key;
  updateTray();
  const title = r.v === "product" && S.prod[r.id] ? S.prod[r.id].name : r.v === "insurer" && S.comp[r.id] ? cname(r.id) : r.v === "kpi" && S.b && kmeta(r.id) ? kmeta(r.id).name : r.v === "dept" && S.b ? ((allPillars().find(p => p.id === r.id) || {}).name || null) : null;
  document.title = title ? `${title} · Life Insurance Benchmark` : "Life Insurance Benchmark";
}
function init(d){
  S.d = d;
  d.companies.forEach(c => S.comp[c.id] = c);
  d.products.forEach(p => S.prod[p.id] = p);
  const saved = ls.get("ip.cmp", {P:[], I:[]});
  S.cmpP = (saved.P || []).filter(id => S.prod[id]); S.cmpI = (saved.I || []).filter(id => S.comp[id]);
  const bsel = $("#bench");
  [...d.companies].sort((a,b) => cname(a.id).localeCompare(cname(b.id))).forEach(c => bsel.append(h("option", {value:c.id}, cname(c.id))));
  const savedBench = ls.get("ip.bench", null), b = savedBench == null ? (S.comp.bajaj ? "bajaj" : "") : savedBench;
  if (b && S.comp[b]) { S.bench = b; bsel.value = b; }
  bsel.addEventListener("change", () => { setBench(bsel.value); render(); });
  S.watch = arr(ls.get("ip.watch", [])).filter(c => S.comp[c]);
  const si = S.b ? seasonInfo() : null;
  $("#asof").textContent = [si ? "Season " + si.label : null, d.meta.data_as_of ? "data as of " + fmtDate(d.meta.data_as_of) : null].filter(Boolean).join(" · ");
  updateMyCrest();
  document.body.append(bottomNav());
  $("#openpal").addEventListener("click", openPal);
  document.addEventListener("keydown", e => {
    const t = e.target, typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
    if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)){ e.preventDefault(); if (PAL && !PAL.root.hidden) closePal(); else openPal(); }
    else if (e.key === "/" && !typing){ e.preventDefault(); openPal(); }
    else if (e.key === "Escape" && PAL && !PAL.root.hidden) closePal();
  });
  $("#trayclear").addEventListener("click", () => { S.cmpP = []; S.cmpI = []; ls.set("ip.cmp", {P:[], I:[]}); updateTray(); if (S.route.v === "compare") render(); });
  window.addEventListener("hashchange", render);
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => document.querySelectorAll(".svgchart").forEach(svg => { const holder = svg.parentNode; if (holder && holder._redraw) holder._redraw(); }), 200); });
  render();
}
function initBench(b){
  if (!b || !b.framework) return;
  S.b = b;
  b.framework.pillars.forEach(p => p.kpis.forEach(k => S.kmeta[k.id] = {...k, pillar:p.id}));
  b.companies.forEach(c => S.bcomp[c.id] = c);
  S.peer = ls.get("ip.peer", "all");
}
Promise.all([
  fetch("data/dashboard.json", {cache:"no-cache"}).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
  fetch("data/benchmark.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : null).catch(() => null)
]).then(([d, b]) => { try { initBench(b); } catch (e) { S.b = null; } init(d); })
  .catch(err => { $("#view").replaceChildren(h("div", {class:"empty"}, h("h3", null, "The catalogue file did not load"), h("p", null, "Reload the page. If it keeps failing, the data file data/dashboard.json is missing from the published files (" + err.message + ")."))); });
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
